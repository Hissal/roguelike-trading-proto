<!-- THROWAWAY PROTOTYPE (round 2): one boss day against The Manipulator, built on
     accepted presentation C (6532402). Question: does a boss with unique powers
     create offense/defense decisions, and what should its telegraph reveal?
     Restricted boss info by default; the Wiretap card reveals targets/trades for
     2 turns; bait combo: joined pump -> Halt -> Dump (40%). Boss numbers (pump +$5/tick for 2-4 ticks, dump -$6 per pumped tick,
     smear -$8, $15 lead trigger, 60% news dodge) are untuned guesses.
     Market engine and player cards otherwise unchanged. Spec: .scratch/boss-rival/spec.md -->

/* Round five: protect the graph and collect holdings beside execution. */
.company{gap:.42rem}.chart{min-height:8.5rem;flex:1 0 8.5rem;max-height:none}
.chart svg{height:100%;min-height:8.5rem}
.company-actions{gap:.35rem}.contributions{padding:.4rem .55rem;border-radius:.35rem;background:#101e1744}

.card-total .impact-symbol{font-size:1.05rem}.card-total>span:last-child{color:var(--muted)}
.position-block{display:flex;gap:.7rem;align-items:center;padding:.5rem .65rem;border:1px solid #7d8b6466;background:#101b1666;border-radius:.4rem}

.position-content{flex:1;min-width:0}.position-summary{display:flex;align-items:baseline;gap:.65rem;font-size:.9rem}

.exposure-percent{color:var(--accent)}.position-block .exposure-track{margin:.3rem 0;height:.4rem}

.position-block .holdings b{font-size:.8rem;margin-top:.1rem}.position-dial .exposure-dial{width:3.6rem;height:3.6rem;padding:.33rem}
.variant-A .position-block{padding:.55rem .7rem}.variant-A .position-summary{font-size:.94rem}

const Engine=(()=>{
 const steps=12;

  'Maintenance review due tick 1; engineering findings tick 4. Repairs may be limited or expose a longer shutdown. A sharp initial fall need not mean recovery is coming.',

   1:event(0,'Forge announces an unplanned maintenance stop. Sellers react sharply, but engineers have not established its extent. Findings are due at tick 4.',-2,-2,-11,'Findings tick 4: a contained repair could reverse the selloff; deeper damage could cause another fall.','Initial report · extent unresolved'),

   6:event(1,'Harbor sees repeat bookings, but fuel and overtime costs remain unsettled. The operating report at tick 7 will determine whether this is profitable growth.',0,.5,0,'Operating results next tick. Bookings alone do not establish profit.','Public evidence · outcome unresolved'),
   7:route?event(1,'Harbor’s pilot earns a sustainable margin. Repeat orders justify expanding the route.',16,2,11,'Profitable route confirmed. A fuel-supply settlement is still open and will resolve at closing tick 12.'):event(1,'Harbor’s pilot loses money despite repeat bookings. Operating costs exceed what customers will pay.',-16,-2,-14,'Loss-making pilot confirmed. A fuel-supply settlement is still open and will resolve at closing tick 12.'),
   8:event(0,'Forge’s largest customer is negotiating a renewal. Volume could increase, but the customer is also considering another supplier. Decision at tick 10.',0,0,0,'Renewal tick 10: a larger order or a lost customer. Current valuation does not reveal the decision.','Negotiations · no agreement'),
   9:event(2,'Lumen’s tariff review enters its final stage. Regulators may allow cost recovery or impose a restrictive cap. Ruling at tick 11.',0,0,-2,'Ruling tick 11: cost recovery or a restrictive cap. Current valuation does not reveal the decision.','Policy review · ruling pending'),
   10:renewal?event(0,'Forge secures the customer renewal with additional volume.',12,1,10,'Renewal secured. No further scheduled company report before closing.'):event(0,'Forge’s customer switches suppliers. The lost order reduces the earnings outlook.',-18,-2,-19,'Customer lost. No further scheduled company report before closing.'),
   11:audit?event(2,'Lumen is allowed to recover its costs through tariffs. Harbor’s fuel settlement remains due at closing next tick.',10,1,9,'Cost recovery approved. No further scheduled company report before closing.'):event(2,'Lumen receives a restrictive tariff cap, compressing margins. Harbor’s fuel settlement remains due at closing next tick.',-16,-2,-18,'Restrictive cap confirmed. No further scheduled company report before closing.'),
   12:costs?event(1,'Harbor agrees a favorable fuel settlement. Closing positions settle at the resulting quotes.',12,1,10,'Fuel settlement complete; session closed.'):event(1,'Harbor must absorb a costly fuel settlement. Closing positions settle after the price reaction.',-16,-2,-17,'Fuel settlement complete; session closed.')

 }
 const round=n=>Math.round((n+Number.EPSILON)*100)/100;
 const fee=n=>round(n*.005);
 const MAX_HAND=5;

 // ---- PROTOTYPE card pool. Numbers are experimental. ----
 // target lists which kinds of target a card accepts: a company, the boss, yourself ('self') or another card in hand.

 const cards={
  investigate:C('Investigate','◎',1,['company'],'Reveal underlying value for 3 ticks.','Reveal underlying value for 5 ticks.'),
  influence:C('Influence','↗',1,['company'],'+$3 per tick for 2–3 ticks. Informed (revealed value above price when played): +$5.','+$5 per tick for 2–4 ticks. Informed (revealed value above price when played): +$8.'),
  suppress:C('Suppress','↘',1,['company'],'−$3 per tick for 2–3 ticks. Informed (revealed value below price when played): −$5.','−$5 per tick for 2–4 ticks. Informed (revealed value below price when played): −$8.'),
  momentum:C('Momentum','⤴',1,['company'],'3 ticks. Gains 1 stack each tick and pushes +$1 per stack: +1, +2, +3.','3 ticks. Gains 1 stack each tick and pushes +$2 per stack: +2, +4, +6.'),
  accelerate:C('Accelerate','»',1,['company'],'Next tick: pull the price 50% of the way to underlying value. It is your effect, so Stabilize does not cancel it.','Next tick: pull the price the whole way to underlying value. It is your effect, so Stabilize does not cancel it.'),

  dividend:C('Dividend','¤',1,['company'],'3 ticks. Every holder, the boss included, receives 1% of their position’s value each tick.','3 ticks. Every holder, the boss included, receives 2% of their position’s value each tick.'),
  foresight:C('Foresight','◔',1,['self'],'This turn: see which way every company will move on the coming tick, counting everything played so far.','This turn: see which way every company will move on the coming tick and whether each move is small or large, counting everything played so far.'),
  projection:C('Projection','◑',1,['company'],'3 ticks. See this company’s direction for each of its remaining ticks, assuming nobody plays anything further.','5 ticks. See this company’s direction for each of its remaining ticks, assuming nobody plays anything further.'),

  empower:C('Empower','✦',1,['self'],'Your next card this turn is empowered.','Your next 2 cards this turn are empowered.'),

 };

 const baseInitial=()=>({step:0,cash:1000,realized:0,fees:0,dividends:0,spent:0,ended:false,debug:false,trades:0,message:'',news:[{step:0,text:opening,kind:'Opening brief · unresolved opportunities'}],log:[],assets:names.map((name,i)=>({name,description:descriptions[i],price:100,value:[104,102,108][i],pressure:0,outlook:openingOutlooks[i],qty:0,cost:0,realized:0,effects:[],bossMoves:[],history:[100],movement:null}))});

 const cardRoll=s=>{s.cardRng=(Math.imul(s.cardRng,1103515245)+12345)>>>0;return s.cardRng/4294967296;};

 // Statuses sit on you or the boss. Active on turns [from, from+turns).

 function sell(s,a,q){const gross=round(q*a.price),f=fee(gross),basis=q===a.qty?a.cost:round(a.cost*q/a.qty),profit=round(gross-f-basis);s.cash=round(s.cash+gross-f);a.qty-=q;a.cost=round(a.cost-basis);a.realized=round(a.realized+profit);s.realized=round(s.realized+profit);s.fees=round(s.fees+f);return profit;}
 function shuffle(s,pile0){const pile=[...pile0];for(let i=pile.length-1;i>0;i--){s.seed=(Math.imul(1664525,s.seed)+1013904223)>>>0;const j=Math.floor(s.seed/4294967296*(i+1));[pile[i],pile[j]]=[pile[j],pile[i]];}return pile;}
 function drawOne(s){if(s.hand.length>=MAX_HAND)return false;if(!s.deck.length){if(!s.discard.length)return false;s.deck=shuffle(s,s.discard);s.discard=[];s.reshuffles++;}s.hand.push(s.deck.pop());return true;}
 function drawN(s,n){let got=0;for(let i=0;i<n;i++)if(drawOne(s))got++;return got;}
 function startTurn(s){s.focus=turnFocus(s);s.rerolled=false;const size=handSize(s);while(s.hand.length<size&&drawOne(s));}

 function classConfig(id,custom){if(id==='custom'&&custom)return {id:'custom',name:'Custom',tagline:'Anything goes.',hand:Math.max(1,Math.min(MAX_HAND,custom.hand|0)),focus:Math.max(0,custom.focus|0),passive:passives[custom.passive]?custom.passive:'none',deck:custom.deck||{}};const c=classes[id]||classes.insider;return {id:classes[id]?id:'insider',...c};}
 function initial(scenarioSeed=1,classId='insider',custom=null){
  const s=baseInitial(),cls=classConfig(classId,custom);let id=0;
  Object.assign(s,{scenarioSeed,cls,events:makeEvents(scenarioSeed),seed:260926,cardRng:(scenarioSeed*2246822519^0x27d4eb2f)>>>0,deck:[],discard:[],burned:[],hand:[],played:[],cardsPlayed:0,reshuffles:0,turnHistory:[],status:[],bossStatus:[],empowered:0,double:false,keep:null,focus:0,rerolled:false});

 // ---- Card targeting ----

  const def=cards[card.kind];if(def.focus>s.focus)return `Needs ${def.focus} Focus; you have ${s.focus}.`;

 // ---- Effects on companies ----
 let fxId=0;
 const addFx=(a,fx)=>{a.effects.push({id:++fxId,src:'player',...fx});};

 function dropFromOperation(s,i){const op=s.boss.op;if(!op)return;op.assets=op.assets.filter(x=>x!==i);if(!op.assets.length)s.boss.op=null;}
 function removeCompanyFx(s,i,test){const a=s.assets[i],had=a.effects.length;if(a.effects.some(e=>e.kind==='pump'&&test(e)))dropFromOperation(s,i);a.effects=a.effects.filter(e=>!test(e));return had-a.effects.length;}
 function removeStatus(s,test){let n=0;s.status=s.status.filter(x=>{if(!test(x))return true;n++;
   // Lifting a debuff that is shaping this turn gives back what it took.
   if(s.step>=x.from&&s.step<x.from+x.turns){if(x.kind==='audit'){s.focus++;drawOne(s);}if(x.kind==='overtimedebt')s.focus++;}return false;});return n;}

 // Resolve one card's effect. Pure effect logic; costs and piles are handled by the caller.
 function resolve(s,kind,target,emp){
  const a=typeof target==='number'?s.assets[target]:null,n=a?.name;
  switch(kind){
   case 'investigate':addFx(a,{kind:'reveal',timing:'duration',remaining:emp?5:3});return `${n}’s value is revealed: $${a.value.toFixed(2)}.`;
   case 'influence':case 'suppress':{const up=kind==='influence',dur=emp?between(s,2,4):between(s,2,3),informed=revealed(s,a)&&(up?a.value>a.price:a.value<a.price),amt=(emp?(informed?8:5):(informed?5:3))*(up?1:-1);
    addFx(a,{kind,timing:'duration',remaining:dur,amount:amt,informed});if(up)a.effects.filter(e=>e.kind==='rumor').forEach(e=>e.stacks++);return `${labels[kind]} ${amt>0?'+':'−'}$${Math.abs(amt)} per tick for ${dur} ticks${informed?' (Informed)':''}.`;}
   case 'momentum':addFx(a,{kind,timing:'duration',remaining:3,stacks:0,per:emp?2:1});return `Momentum builds on ${n}.`;
   case 'accelerate':addFx(a,{kind,timing:'next',frac:emp?1:.5});return `${n} will be pulled ${emp?'all':'half'} the way to its value next tick.`;
   case 'cleanread':addFx(a,{kind,timing:'next',frac:emp?1:.6});return `Clean read on ${n}: next tick ignores Market forces.`;
   case 'stabilize':case 'freeze':case 'volatility':case 'injunction':addFx(a,{kind,timing:'duration',remaining:emp?2:1});return `${labels[kind]} on ${n} for ${emp?2:1} tick${emp?'s':''}.`;
   case 'spin':addFx(a,{kind,timing:'persistent',emp});return `Spin waits for ${n}’s next report.`;
   case 'dividend':addFx(a,{kind,timing:'duration',remaining:3,rate:emp?.02:.01});return `${n} pays ${emp?2:1}% dividends for 3 ticks, to every holder.`;
   case 'projection':addFx(a,{kind,timing:'duration',remaining:emp?5:3});return `Projection on ${n}.`;
   case 'expose':{const p=pumpOf(a);if(!p||!p.stacks)return `No Pump stacks on ${n}; nothing exposed.`;const off=emp?p.stacks:Math.min(2,p.stacks);p.stacks-=off;addFx(a,{kind:'exposed',timing:'next',amount:-5*off});return `Exposed ${off} Pump stack${off>1?'s':''} on ${n}: −$${5*off} next tick.`;}
   case 'cleanslate':{if(emp){s.assets.forEach((_,i)=>removeCompanyFx(s,i,()=>true));s.bossStatus=[];removeStatus(s,()=>true);return 'Every effect everywhere is wiped.';}
    if(a){removeCompanyFx(s,target,()=>true);return `Every effect on ${n} is wiped.`;}if(target==='boss'){s.bossStatus=[];return 'Every effect on the boss is wiped.';}removeStatus(s,()=>true);return 'Every effect on you is wiped.';}
   case 'legalteam':{if(emp){s.assets.forEach((_,i)=>removeCompanyFx(s,i,e=>e.src==='boss'));removeStatus(s,x=>debuffs.includes(x.kind));return 'Boss effects and your debuffs are removed everywhere.';}
    if(a){removeCompanyFx(s,target,e=>e.src==='boss');return `Boss effects on ${n} removed.`;}removeStatus(s,x=>debuffs.includes(x.kind));return 'Your debuffs are removed.';}
   case 'extend':{const k=emp?2:1;if(a){let c=0;a.effects.forEach(e=>{if(e.timing==='duration'){e.remaining+=k;c++;}});return `Extended ${c} effect${c===1?'':'s'} on ${n} by ${k}.`;}
    const list=target==='boss'?s.bossStatus:s.status;let c=0;list.forEach(x=>{if(x.timing==='duration'&&remainingTurns(s,x)>0){x.turns+=k;c++;}});return `Extended ${c} effect${c===1?'':'s'} on ${target==='boss'?'the boss':'you'} by ${k}.`;}
   case 'wiretap':s.bossStatus.push({kind:'wiretap',from:s.step,turns:emp?3:2,timing:'duration'});return 'The boss is wiretapped.';
   case 'counteraudit':case 'buyprotection':{if(kind==='buyprotection')pay(s,moneyFor(kind,emp));const t=cancelAttack(s);if(emp)s.bossStatus.push({kind:'noattack',from:s.step+1,turns:1,timing:'next'});return t+(emp?' It cannot attack next turn.':'');}
   case 'foresight':s.status.push({kind:'foresight',from:s.step,turns:1,timing:'next',emp});return 'Foresight shows where each company goes next tick.';
   case 'empower':s.empowered=emp?2:1;return emp?'Your next 2 cards are empowered.':'Your next card is empowered.';
   case 'research':return `Drew ${drawN(s,emp?3:2)} card(s).`;
   case 'rethink':{const n0=s.hand.length;s.discard.push(...s.hand.splice(0));return `Rethink: drew ${drawN(s,n0+(emp?2:1))}.`;}
   case 'overtime':s.focus+=2;if(!emp)s.status.push({kind:'overtimedebt',from:s.step+1,turns:1,timing:'next'});return '+2 Focus now.'+(emp?'':' −1 Focus next turn.');

   case 'holdthought':{const c=s.hand.find(x=>'c'+x.id===target);c.retain=true;return `${labels[c.kind]} will stay in hand.`;}
   case 'allin':{const c=s.hand.find(x=>'c'+x.id===target);c.allin=true;return `All in: ${labels[c.kind]} will be played empowered, then burned.`;}
   case 'insidertrade':{const t=nextReportTick(s,target);if(t===null)return `${n} has no further report.`;const e=s.events[t],good=e.value+e.shock>0;addFx(a,{kind:'leak',timing:'persistent',good,tick:t});return `Leak: ${n}’s tick ${t} report is ${good?'GOOD':'BAD'} news.`;}
   case 'hottip':{const mine=a.qty>0,theirs=s.boss.pos[target].qty>0,lean=emp?.3:.1,pUp=.5+(mine&&!theirs?lean:!mine&&theirs?-lean:0),up=cardRoll(s)<pUp,amt=(emp?10:6)*(up?1:-1);addFx(a,{kind,timing:'duration',remaining:3,amount:amt});return `Hot tip (${Math.round(pUp*100)}% up) breaks ${up?'up':'down'}: ${amt>0?'+':'−'}$${Math.abs(amt)} per tick for 3 ticks.`;}
   case 'doubleornothing':s.double=emp?3:2;return `Your next card resolves ${emp?'three times':'twice'}, or not at all.`;

   case 'hireanalysts':pay(s,moneyFor(kind,emp));addFx(a,{kind:'reveal',timing:'duration',remaining:emp?5:3});return `Paid $20: drew ${drawN(s,2)}; ${n}’s value is $${a.value.toFixed(2)}.`;

 function pay(s,amount){s.cash=round(s.cash-amount);s.spent=round(s.spent+amount);}

 // Play every card in `pile` for free (Barrage, Frenzy). Returns summary text.
 function autoPlay(s,pile,pickTarget,emp){const out=[];
  pile.forEach(card=>{const kind=card.kind==='echo'?lastPlayed(s):card.kind;
   const t=kind?pickTarget(targetsFor(s,card.kind)):null;
   if(t===null||t===undefined||moneyFor(kind,emp||card.allin)>s.cash){s.discard.push(card);out.push(`${labels[card.kind]} discarded`);return;}
   const e=emp||card.allin,text=resolve(s,kind,t,e);s.played.push({card:card.kind,kind,target:t});s.cardsPlayed++;
   ((card.allin||cards[card.kind].burn)?s.burned:s.discard).push(card);out.push(`${labels[card.kind]}${card.kind==='echo'?' → '+labels[kind]:''}: ${text}`);});

 function playCard(s,index,target){

  const kind=card.kind==='echo'?lastPlayed(s):card.kind;

  for(let r=0;r<times;r++){
   if(kind==='barrage'){const others=s.hand.splice(0);texts.push('Barrage → '+(autoPlay(s,others,ts=>ts.includes('company')?target:null,emp)||'no other cards'));continue;}
   if(kind==='frenzy'){const others=s.hand.splice(0);const pick=ts=>{const opts=[];if(ts.includes('company'))opts.push(0,1,2);if(ts.includes('boss'))opts.push('boss');if(ts.includes('self'))opts.push('self');if(ts.includes('card'))s.hand.forEach(c=>opts.push('c'+c.id));return opts.length?opts[Math.floor(cardRoll(s)*opts.length)]:null;};

 function act(state,action){const s=structuredClone(state),a=s.assets[action.asset];if(s.ended)return s;

   if(s.rules.halt===action.asset){s.message=`Trading Halt: ${a.name} cannot be traded this turn.`;return s;}
   const q=Number(action.qty);if(!a||!Number.isSafeInteger(q)||q<1){s.message='Choose a positive whole number of shares.';return s;}
   const gross=round(q*a.price),f=fee(gross),total=round(gross+f);
   if(action.type==='buy'){if(!Number.isFinite(total)||total>s.cash){s.message='Not enough cash for these shares and their fee.';return s;}s.cash=round(s.cash-total);a.qty+=q;a.cost=round(a.cost+total);s.fees=round(s.fees+f);record(s,`Bought ${q} ${a.name} for $${total.toFixed(2)}, including $${f.toFixed(2)} fee.`);}
   else{if(q>a.qty){s.message='You do not own that many shares.';return s;}const profit=sell(s,a,q);record(s,`Sold ${q} ${a.name}. Realised profit: $${profit.toFixed(2)} after fees.`);}s.trades++;

 function advance(s){

  s.turnHistory.push({turn:s.step+1,played:s.played.map(p=>`${labels[p.card]}${p.card==='echo'?' → '+labels[p.kind]:''}`),unused,kept:kept.map(c=>labels[c.kind]).join(', ')});

  const intent=s.boss.intent,logBefore=s.boss.log.length;bossPreTick(s,intent);
  s.step++;const event=s.events[s.step];if(event){s.news.unshift({step:s.step,text:event.text,kind:event.kind});const target=s.assets[event.asset];target.value+=event.value;target.pressure=event.pressure;target.outlook=event.outlook;}
  s.assets.forEach((a,i)=>{
   const before=a.price,noise=(((s.step*17+i*11)%13)-6)*.12,fx=k=>a.effects.filter(e=>e.kind===k),report=event?.asset===i;
   const gap=a.value-before,correction=.12*gap,shock=report?event.shock:0;
   const rawMarket=correction+a.pressure+noise+shock;
   // Spin reshapes only this company's report jolt.
   let spunShock=shock;if(report)fx('spin').forEach(e=>{spunShock=spunShock>0?spunShock*2:spunShock*(e.emp?0:.5);});
   const spun=rawMarket-shock+spunShock;
   const cancel=fx('stabilize').length||fx('cleanread').length,mult=cancel?0:2**fx('volatility').length,market=spun*mult;
   const bossRaw=a.bossMoves.reduce((n,m)=>n+m.amount,0),blocked=fx('injunction').length>0,boss=blocked?0:bossRaw;
   const parts=[{label:'Market forces',amount:rawMarket}];
   if(spunShock!==shock)parts.push({label:'Spin',amount:spunShock-shock});
   if(market!==spun)parts.push({label:cancel?(fx('cleanread').length?'Clean read (market cancelled)':'Stabilize'):'Volatility',amount:market-spun});
   if(a.bossMoves.length)parts.push({label:'◆ '+[...new Set(a.bossMoves.map(m=>bossLabels[m.kind]))].join(' + '),amount:bossRaw});
   if(blocked&&bossRaw)parts.push({label:'Injunction',amount:-bossRaw});
   let player=0;const add=(label,amt)=>{if(!amt)return;player+=amt;const p=parts.find(x=>x.label===label);if(p)p.amount+=amt;else parts.push({label,amount:amt});};
   a.effects.forEach(e=>{
    if(['influence','suppress','hottip','paidpromotion','exposed'].includes(e.kind))add(e.kind==='exposed'?'Expose':labels[e.kind]+(e.informed?' (Informed)':''),e.amount);
    if(e.kind==='momentum'){e.stacks++;add('Momentum',e.stacks*e.per);}
    if(report&&e.kind==='rumor')add('Rumor',4*e.stacks);
   });
   const pull=Math.min(1,[...fx('accelerate'),...fx('cleanread')].reduce((n,e)=>n+e.frac,0));

   if(fx('freeze').length&&total){parts.push({label:'Freeze',amount:-total});total=0;}
   const quote=d=>round(Math.max(10,before+d));
   a.price=quote(total);
   const without=quote(rawMarket+bossRaw);
   parts.forEach(p=>p.amount=round(p.amount));
   a.movement={step:s.step,before,without,parts:parts.filter(p=>p.amount||p.label==='Market forces'),actual:round(a.price-before),powered:a.effects.some(e=>e.src==='player')};
   // Dividends go to every holder at the new quote.
   fx('dividend').forEach(e=>{const mine=round(a.qty*a.price*e.rate*(s.cls.passive==='dividends'?2:1)),theirs=round(s.boss.pos[i].qty*a.price*e.rate);
    if(mine){s.cash=round(s.cash+mine);s.dividends=round(s.dividends+mine);}if(theirs){s.boss.cash=round(s.boss.cash+theirs);s.boss.dividends=round(s.boss.dividends+theirs);}});
   a.history.push(a.price);a.pressure=round(a.pressure*.65);a.bossMoves=[];
   a.effects=a.effects.filter(e=>{if(e.timing==='next')return false;if(e.timing==='duration')return --e.remaining>0;if(report&&['spin','rumor'].includes(e.kind))return false;if(e.kind==='leak'&&e.tick<=s.step)return false;return true;});

  bossPostTick(s,intent);

   s.boss.intent=null;s.ended=true;s.discard.push(...s.hand);s.hand=[];

   s.message=`Day closed. You ${mine<0?'−':'+'}$${Math.abs(mine).toFixed(2)} vs Manipulator ${theirs<0?'−':'+'}$${Math.abs(theirs).toFixed(2)}: ${mine>theirs?'you beat the boss.':mine===theirs?'a dead heat.':'the boss wins this day.'}`;
  }else{startTurn(s);planBoss(s);}

 // What the coming ticks would do if nobody plays or trades further. Used by Foresight and Projection.
 function forecast(s,ticks){let t=structuredClone(s);const out=s.assets.map(()=>[]);
  for(let k=0;k<ticks&&!t.ended&&t.step<steps;k++){const before=t.assets.map(a=>a.price);t.hand=[];advance(t);t.assets.forEach((a,i)=>out[i].push(round(a.price-before[i])));}
  return out;}

 // ---- PROTOTYPE boss: The Manipulator. Public information only; committed telegraphs. ----
 const bossLabels={pump:'Pump',dump:'Dump',smear:'Smear',audit:'Hostile Audit',halt:'Trading Halt'};
 const bossDescriptions={
  pump:'Persistent, with stacks, on every company it held when the operation began. Each pumped tick pushes +$5 and adds a stack. It runs 2–4 ticks; the length is never announced.',
  dump:'Ends the pump (early if a report is due on the coming tick). It sells the pumped shares at the quote before that tick moves, which also dodges that tick’s news. Each company then drops $6 per Pump stack.',
  smear:'−$8 on the coming tick against whichever company was your largest holding (by value) when it was announced. Selling it this turn dodges the hit.',
  audit:'Debuff: next turn you draw 1 card fewer and have 1 less Focus.',
  halt:'Next turn one company cannot be bought or sold. It may lock you out of a pump, trap you before a report, or trap you after a drop.'
 };
 const bossRoll=s=>{s.boss.rng=(Math.imul(s.boss.rng,1103515245)+12345)>>>0;return s.boss.rng/4294967296;};

 const armedTarget=armedCard()&&armed!==i&&Engine.targetsFor(state,armedCard().kind).includes('card');
 const extras=[armedTarget?`<button id="apply-${i}" class="primary mini" ${Engine.cardReason(state,armed,'c'+c.id)?'disabled':''}>${cardDef(armedCard()).icon} Apply here</button>`:'',state.cls.passive==='retain'&&!state.ended?`<button id="keep-${i}" class="mini" aria-pressed="${state.keep===c.id}">${state.keep===c.id?'Kept':'Keep'}</button>`:'',state.cls.passive==='reroll'&&!state.rerolled&&!state.ended?`<button id="reroll-${i}" class="mini">Reroll</button>`:''].join('');
 return `<div class="card ${armed===i?'armed':''} ${emp?'empowered':''}"><button class="pick-card" id="card-${i}" aria-pressed="${armed===i}" ${state.ended?'disabled':''}><span class="card-icon" aria-hidden="true">${d.icon}</span><div><strong>${d.name} <em class="cost">${d.focus}F${cost?' · $'+cost:''}</em><span class="tags">${tags}</span></strong><span>${emp?d.emp:d.text}${kind?` <b>Copies ${Engine.labels[kind]}.</b>`:''}</span></div></button><button class="card-info" id="card-info-${i}" data-menu="card-${i}" aria-label="${d.name} full description">ⓘ</button>${extras?`<div class="card-extras">${extras}</div>`:''}</div>`;}
function hand(){const c=armedCard(),statuses=state.status.filter(x=>Engine.remainingTurns(state,x)>0),size=Engine.handSize(state);
 const turnChips=[state.empowered?`<span class="buff">✦ Empowered ×${state.empowered} · this turn</span>`:'',state.double?`<span class="buff">⚄ ${state.double===3?'Triple':'Double'} or nothing armed</span>`:''].join('');
 const onYou=turnChips+statusChips(statuses,'player');
 return `<section class="hand-zone" style="--cards:${Math.max(3,state.hand.length)}"><div class="player-effects status-chips" aria-label="Effects on you"><small>On you</small>${onYou||'<span class="none">No effects</span>'}</div><div class="hand-heading"><div><h2 class="hand-state">${!c?`${state.cls.name} · hand ${state.hand.length}/${size}`:cardDef(c).name+' selected'}</h2><div class="hand-plays">Focus ${state.ended?0:state.focus} / ${state.cls.focus}${state.rules.halt!==null&&!state.ended?' · ⛔ Halt':''}</div>${playHere('self','play-self','on yourself')}<p>${Engine.passives[state.cls.passive].name}: ${Engine.passives[state.cls.passive].text}</p></div></div><div class="hand">${state.hand.map(cardFace).join('')||'<p class="muted">No cards in hand. Finish your trades, then end turn.</p>'}</div><aside class="end-zone"><div class="turn-dots" aria-label="${state.step} of 12 ticks resolved">${Array.from({length:12},(_,i)=>`<i class="${i<state.step?'done':''}"></i>`).join('')}</div><small>${state.ended?'All positions settled':`Deck ${state.deck.length} · discard ${state.discard.length}${state.burned.length?' · burned '+state.burned.length:''}`}</small><button id="advance" class="primary" ${state.ended?'disabled':''}>${state.ended?'Closed':state.step===11?'End turn & settle →':'End turn →'}</button></aside></section>`;}

function render(){if(!state){renderPicker();return;}forecastCache=null;const focused=document.activeElement?.id;document.body.className='scene-C';
 $('app').innerHTML=`<header class="hud"><div class="brand"><span class="brand-icon">◈</span><div><small>PROTOTYPE · CARD DESIGN · ${state.cls.name.toUpperCase()}</small><h1>The trading floor</h1></div></div><div class="resources"><div><small>Cash</small><b>${money(state.cash)}</b></div><div><small>Wealth</small><b>${money(Engine.equity(state))}</b></div>${score()}</div><button id="session" data-menu="session">☷ Menu</button></header><div class="status-line"><span class="status" role="status" aria-live="polite">${state.message}</span><div class="archive-buttons"><button id="activity" data-menu="activity">Activity ↗</button><button id="news" data-menu="news">News ↗</button><button id="glossary" data-menu="glossary">Cards ↗</button></div></div>${bossStrip()}<div class="mobile-quotes">${state.assets.map((a,i)=>`<button id="mobile-${i}" aria-pressed="${selection===i}"><b>${tickers[i]} ${money(a.price)}</b><small>Prev ${a.movement?money(a.movement.before):'—'} · ${a.movement?signed(a.movement.actual):'opening'}</small></button>`).join('')}</div><main class="workspace"><section class="companies">${state.assets.map(company).join('')}</section>${hand()}</main><footer><span>*Open P/L excludes selling fees · 0.5% per trade · spent on cards ${money(state.spent)} · dividends ${money(state.dividends)}</span></footer>`;
 document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.menu,b.id));
 state.assets.forEach((a,i)=>{$('qty-'+i).oninput=e=>{quantities[i]=e.target.value;preview();};$('buy-'+i).onclick=()=>dispatch({type:'buy',asset:i,qty:quantities[i]});$('sell-'+i).onclick=()=>dispatch({type:'sell',asset:i,qty:quantities[i]});$('sell-all-'+i).onclick=()=>dispatch({type:'sell',asset:i,qty:state.assets[i].qty});$('cast-'+i).onclick=()=>{if(armed!==null){selection=i;dispatch({type:'card',index:armed,target:i});}};$('mobile-'+i).onclick=()=>{selection=i;render();};});
 state.hand.forEach((c,i)=>{$('card-'+i).onclick=()=>{armed=armed===i?null:i;render();};if($('apply-'+i))$('apply-'+i).onclick=()=>dispatch({type:'card',index:armed,target:'c'+c.id});if($('keep-'+i))$('keep-'+i).onclick=()=>dispatch({type:'keep',index:i});if($('reroll-'+i))$('reroll-'+i).onclick=()=>dispatch({type:'reroll',index:i});});
 $('advance').onclick=()=>dispatch({type:'advance'});if($('play-boss'))$('play-boss').onclick=()=>dispatch({type:'card',index:armed,target:'boss'});if($('play-self'))$('play-self').onclick=()=>dispatch({type:'card',index:armed,target:'self'});
 preview();if(focused)$(focused)?.focus({preventScroll:true});}
function preview(){state.assets.forEach((a,i)=>{const q=Number(quantities[i]),valid=Number.isSafeInteger(q)&&q>0,gross=Engine.round(q*a.price),fee=Engine.fee(gross);$('preview-'+i).textContent=valid?`Buy ${money(Engine.round(gross+fee))} · sell ${money(Engine.round(gross-fee))} · fee ${money(fee)}`:'Enter positive whole shares.';const halted=state.rules.halt===i;$('buy-'+i).disabled=halted||state.ended||!valid||gross+fee>state.cash;$('sell-'+i).disabled=halted||state.ended||!valid||q>a.qty;$('sell-all-'+i).disabled=halted||state.ended||!a.qty;if(halted)$('preview-'+i).textContent='◆ Trading Halt: no trades in this company this turn.';});}
function dispatch(action){state=Engine.act(state,action);if(action.type==='card'||action.type==='advance'||action.type==='reroll')armed=null;render();}

// ---- Class picker and Custom builder ----
function deckList(deck){return Object.entries(deck).filter(([,n])=>n>0).map(([k,n])=>`${Engine.cards[k].icon} ${Engine.cards[k].name}${n>1?' ×'+n:''}`).join(' · ');}
function renderPicker(){document.body.className='scene-C picking';const seed=Number(params.get('seed'))||1;
 const pool=Object.entries(Engine.cards);
 $('app').innerHTML=`<section class="picker"><header><small>PROTOTYPE · CARD DESIGN</small><h1>Choose a class</h1><p>Same boss day, same market, same seed. Each class has its own hand size, Focus per turn, passive and deck. Scenario seed <input id="pick-seed" type="number" min="1" value="${seed}"></p></header><div class="class-grid">${Object.entries(Engine.classes).map(([id,c])=>`<article class="class-card"><h2>${c.name}</h2><p class="tagline">${c.tagline}</p><dl><dt>Hand</dt><dd>${c.hand}</dd><dt>Focus / turn</dt><dd>${c.focus}</dd><dt>Passive</dt><dd>${Engine.passives[c.passive].name}: ${Engine.passives[c.passive].text}</dd><dt>Deck (${Object.values(c.deck).reduce((a,b)=>a+b,0)})</dt><dd>${deckList(c.deck)}</dd></dl><button class="primary" id="start-${id}">Play ${c.name}</button></article>`).join('')}
 <article class="class-card custom"><h2>Custom</h2><p class="tagline">Anything goes. Build any deck from every card; no balance limits (hand cap 5).</p><div class="custom-rules"><label>Hand <input id="cu-hand" type="number" min="1" max="5" value="${customDraft.hand}"></label><label>Focus <input id="cu-focus" type="number" min="0" max="20" value="${customDraft.focus}"></label><label>Passive <select id="cu-passive">${Object.entries(Engine.passives).map(([k,p])=>`<option value="${k}" ${customDraft.passive===k?'selected':''}>${p.name}</option>`).join('')}</select></label></div><div class="custom-deck">${pool.map(([k,d])=>`<div class="cu-row"><span title="${d.text}">${d.icon} ${d.name}${d.cls?` <i class="tag cls">${Engine.classes[d.cls]?.name||'Custom'}</i>`:''}</span><button id="cu-minus-${k}" class="mini">−</button><b>${customDraft.deck[k]||0}</b><button id="cu-plus-${k}" class="mini">+</button></div>`).join('')}</div><button class="primary" id="start-custom">Play Custom (${Object.values(customDraft.deck).reduce((a,b)=>a+b,0)} cards)</button></article></div></section>`;
 const seedNow=()=>Math.max(1,Number($('pick-seed').value)||1);
 Object.keys(Engine.classes).forEach(id=>$('start-'+id).onclick=()=>start(id,seedNow()));
 const syncRules=()=>{customDraft.hand=Number($('cu-hand').value);customDraft.focus=Number($('cu-focus').value);customDraft.passive=$('cu-passive').value;};
 pool.forEach(([k])=>{$('cu-minus-'+k).onclick=()=>{syncRules();customDraft.deck[k]=Math.max(0,(customDraft.deck[k]||0)-1);renderPicker();};$('cu-plus-'+k).onclick=()=>{syncRules();customDraft.deck[k]=(customDraft.deck[k]||0)+1;renderPicker();};});
 $('start-custom').onclick=()=>{syncRules();start('custom',seedNow());};}
function start(id,seed){state=Engine.initial(seed,id,id==='custom'?structuredClone(customDraft):null);armed=null;const url=new URL(location.href);url.searchParams.set('class',id);url.searchParams.set('seed',seed);try{history.replaceState(null,'',url);}catch{}render();}

function openDrawer(kind,from){drawerKind=kind;returnFocus=from;fillDrawer();$('drawer').showModal();$('close-drawer').focus();}
function closeDrawer(){$('drawer').close();drawerKind=null;if(returnFocus)$(returnFocus)?.focus({preventScroll:true});}
function glossary(){return `<p>Timings: <b>Nt</b> lasts N ticks and can be extended · <b>⏵ next tick</b> shapes only the coming tick · <b>∞</b> stays until removed · Immediate cards resolve on play. Stacks (×N) are separate from timing. Everything stacks as separate instances.</p><p>Price sources: <b>Market forces</b> (correction toward value, report jolts, fluctuation), <b>Boss effects</b>, and <b>your effects</b>.</p>${Object.values(Engine.cards).map(d=>`<article><p><b>${d.icon} ${d.name}</b> · ${d.focus} Focus${d.money?` + $${d.money}`:''}${d.cls?` · ${Engine.classes[d.cls]?.name||'Custom'} card`:''}${d.burn?' · Burn':''}</p><p>${d.text}</p><p><small>Empowered: ${d.emp}</small></p></article>`).join('')}`;}
function fillDrawer(){let title='',body='';
 if(drawerKind.startsWith('asset-')){const i=Number(drawerKind.split('-')[1]),a=state.assets[i],past=state.news.filter(n=>n.step>0&&n.text.startsWith(['Forge','Harbor','Lumen'][i]));title=a.name+' / dossier';body=`<h3>Known / public evidence</h3><p>${past[0]?.text||a.description+' No company report has resolved yet.'}</p><h3>Unresolved / upcoming reports</h3><p>${a.outlook}</p><h3>Active effects</h3><div class="power-strip">${effects(a)||'<span class="muted">None</span>'}</div>${Engine.revealed(state,a)?`<p>Current investigated value ${money(a.value)}.</p>`:'<p>Current value hidden. Investigate to reveal.</p>'}<h3>Company report history</h3>${past.map(n=>`<article><small>Tick ${n.step} · ${n.kind}</small><p>${n.text}</p></article>`).join('')||'<p>No resolved reports.</p>'}`;}
 else if(drawerKind.startsWith('card-')){const c=state.hand[Number(drawerKind.split('-')[1])];if(!c){closeDrawer();return;}const d=cardDef(c),emp=Engine.willEmpower(state,c);title=d.icon+' '+d.name;body=`<p>${d.focus} Focus${d.money?` + $${Engine.moneyFor(c.kind,emp)}`:''}. Targets: ${Engine.targetsFor(state,c.kind).join(', ')||'(needs an earlier card this turn)'}.</p><p>${emp&&d.emp!=='—'?'<b>Empowered:</b> '+d.emp:d.text}</p><p>Select the card, then use a Play button on a company, the boss strip, your hand box, or another card.</p>`;}
 else if(drawerKind==='boss'){title='◆ The Manipulator';body=bossDrawer();}
 else if(drawerKind==='glossary'){title='Card glossary';body=glossary();}
 else if(drawerKind==='news'){title='Public news archive';body=state.news.map(n=>`<article><small>Tick ${n.step} · ${n.kind}</small><p>${n.text}</p></article>`).join('');}
 else if(drawerKind==='activity'){title='Activity & accounting';body=`<p>Realized P/L ${signed(state.realized)} · dividends ${money(state.dividends)} · spent on cards ${money(state.spent)} · fees ${money(state.fees)} · seed ${state.scenarioSeed}${state.debug?' · debug-assisted':''}.</p><h3>Played this turn</h3><p>${state.played.map(p=>Engine.labels[p.card]+(p.card==='echo'?' → '+Engine.labels[p.kind]:'')).join('; ')||'None'}</p>${state.log.map(n=>`<article><small>After tick ${n.step}</small><p>${n.text}</p></article>`).join('')}<h3>Past hands</h3>${state.turnHistory.map(t=>`<p>Turn ${t.turn} · played ${t.played.join('; ')||'none'} · discarded ${t.unused||'none'}${t.kept?' · kept '+t.kept:''}</p>`).join('')}`;}
 else{title='Session & reference';body=`<p>PROTOTYPE: card design and classes. One boss day against The Manipulator. You are playing <b>${state.cls.name}</b> (hand ${state.cls.hand}, Focus ${state.cls.focus}, ${Engine.passives[state.cls.passive].name}).</p><div class="session-controls"><label for="seed">Scenario seed</label><input id="seed" type="number" min="1" max="999999" value="${state.scenarioSeed}"><button id="load-seed">Load seed</button><button id="replay">Replay current seed</button><button id="new-seed">New scenario</button><button id="change-class">Change class</button></div><h3>Rules</h3><p>12 turns. $1,000 capital. Beat the Manipulator’s closing profit. Trade freely at current quotes with 0.5% fees. Each turn you draw up to your hand size (max 5) and get your Focus; cards cost Focus (some cost cash instead). Unused cards are discarded at End Turn unless they have Retain. Empowered lasts until the end of the turn.</p><p>Your deck: ${deckList(state.cls.deck)}.</p><details id="debug"><summary>Debug inspection · spoilers</summary><p>Opening marks this session debug-assisted.</p><pre id="debug-state"></pre></details>`;}
 $('drawer-title').textContent=title;$('drawer-content').innerHTML=body;
 if(drawerKind==='session'){const go=seed=>{closeDrawer();start(state.cls.id,seed);};$('load-seed').onclick=()=>go(Number($('seed').value)||1);$('replay').onclick=()=>go(state.scenarioSeed);$('new-seed').onclick=()=>go(state.scenarioSeed%999999+1);$('change-class').onclick=()=>{closeDrawer();const url=new URL(location.href);url.searchParams.delete('class');try{history.replaceState(null,'',url);}catch{}state=null;render();};$('debug').ontoggle=()=>{if($('debug').open){state.debug=true;$('debug-state').textContent=JSON.stringify(state,null,2);}else $('debug-state').textContent='';};}}
$('close-drawer').onclick=closeDrawer;$('drawer').addEventListener('cancel',e=>{e.preventDefault();closeDrawer();});$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))closeDrawer();});
document.addEventListener('keydown',e=>{if($('drawer').open||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='Escape'&&armed!==null){armed=null;render();}});
{const id=params.get('class');if(id&&(Engine.classes[id]||id==='custom'))start(id,Number(params.get('seed'))||1);else render();}
</script></body></html>
