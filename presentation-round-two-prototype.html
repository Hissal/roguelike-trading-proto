   1:event(0,'Forge announces an unplanned maintenance stop. Sellers react sharply, but engineers have not established its extent. Findings are due at tick 4.',-2,-2,-11,'Findings tick 4: a contained repair could reverse the selloff; deeper damage could cause another fall.','Initial report · extent unresolved'),

   9:event(2,'Lumen’s tariff review enters its final stage. Regulators may allow cost recovery or impose a restrictive cap. Ruling at tick 11.',0,0,-2,'Ruling tick 11: cost recovery or a restrictive cap. Current valuation does not reveal the decision.','Policy review · ruling pending'),
   10:renewal?event(0,'Forge secures the customer renewal with additional volume.',12,1,10,'Renewal secured. No further scheduled company report before closing.'):event(0,'Forge’s customer switches suppliers. The lost order reduces the earnings outlook.',-18,-2,-19,'Customer lost. No further scheduled company report before closing.'),
   11:audit?event(2,'Lumen is allowed to recover its costs through tariffs. Harbor’s fuel settlement remains due at closing next tick.',10,1,9,'Cost recovery approved. No further scheduled company report before closing.'):event(2,'Lumen receives a restrictive tariff cap, compressing margins. Harbor’s fuel settlement remains due at closing next tick.',-16,-2,-18,'Restrictive cap confirmed. No further scheduled company report before closing.'),
   12:costs?event(1,'Harbor agrees a favorable fuel settlement. Closing positions settle at the resulting quotes.',12,1,10,'Fuel settlement complete; session closed.'):event(1,'Harbor must absorb a costly fuel settlement. Closing positions settle after the price reaction.',-16,-2,-17,'Fuel settlement complete; session closed.')
  };
 }
 const round=n=>Math.round((n+Number.EPSILON)*100)/100;
 const fee=n=>round(n*.005);
 const baseInitial=()=>({step:0,cash:1000,realized:0,fees:0,ended:false,targetStep:null,debug:false,trades:0,boosts:0,message:'Read the three opportunities, then choose where to commit your cash and powers.',news:[{step:0,text:opening,kind:'Opening brief · unresolved opportunities'}],log:[],assets:names.map((name,i)=>({name,description:descriptions[i],price:100,value:[104,102,108][i],pressure:0,outlook:openingOutlooks[i],qty:0,cost:0,realized:0,revealUntil:0,effect:null,stabilize:false,accelerate:false,history:[100],movement:null}))});
 const revealed=(s,a)=>s.step<a.revealUntil;
 const equity=s=>round(s.cash+s.assets.reduce((n,a)=>n+a.qty*a.price,0));
 const record=(s,text)=>{s.message=text;s.log.unshift({step:s.step,text});};
 function sell(s,a,q){const gross=round(q*a.price),f=fee(gross),basis=q===a.qty?a.cost:round(a.cost*q/a.qty),profit=round(gross-f-basis);s.cash=round(s.cash+gross-f);a.qty-=q;a.cost=round(a.cost-basis);a.realized=round(a.realized+profit);s.realized=round(s.realized+profit);s.fees=round(s.fees+f);return profit;}
 function act(state,action){const s=structuredClone(state),a=s.assets[action.asset];if(s.ended)return s;
  if(action.type==='buy'||action.type==='sell'){
   const q=Number(action.qty);if(!a||!Number.isSafeInteger(q)||q<1){s.message='Choose a positive whole number of shares.';return s;}
   const gross=round(q*a.price),f=fee(gross),total=round(gross+f);
   if(action.type==='buy'){if(!Number.isFinite(total)||total>s.cash){s.message='Not enough cash for these shares and their fee.';return s;}s.cash=round(s.cash-total);a.qty+=q;a.cost=round(a.cost+total);s.fees=round(s.fees+f);record(s,`Bought ${q} ${a.name} for $${total.toFixed(2)}, including $${f.toFixed(2)} fee.`);}
   else{if(q>a.qty){s.message='You do not own that many shares.';return s;}const profit=sell(s,a,q);record(s,`Sold ${q} ${a.name}. Realised profit: $${profit.toFixed(2)} after fees.`);}s.trades++;
  }else if(action.type==='card'){
   const problem=cardReason(s,action.index,action.asset);
   if(problem){s.message=problem;return s;}
   const card=s.hand[action.index],kind=card==='echo'?s.played[0].kind:card;
   applyCard(s,kind,action.asset);
   s.hand.splice(action.index,1);s.discard.push(card);
   s.played.push({card,kind,asset:action.asset});s.cardsPlayed++;
   record(s,`${labels[card]}${card==='echo'?` → ${labels[kind]}`:''} on ${a.name}. ${effectText(s,a)} ${2-s.played.length} card plays left.`);
  }else if(action.type==='advance'){
   const unused=s.hand.map(c=>labels[c]).join(', ');
   s.discard.push(...s.hand);s.hand=[];
   s.turnHistory.push({turn:s.step+1,played:s.played.map(p=>`${labels[p.card]} on ${s.assets[p.asset].name}`),unused});
   s.played=[];
   s.step++;const event=s.events[s.step];if(event){s.news.unshift({step:s.step,text:event.text,kind:event.kind});const target=s.assets[event.asset];target.value+=event.value;target.pressure=event.pressure;target.outlook=event.outlook;}
   s.assets.forEach((a,i)=>{
    const before=a.price,noise=(((s.step*17+i*11)%13)-6)*.12;
    const correction=.12*(a.value-before),natural=correction+a.pressure+noise+(event?.asset===i?event.shock:0);
    const accelerated=natural+(a.accelerate?correction:0);
    const shaped=a.stabilize?accelerated*.5:accelerated;
    const base=a.effect?(a.effect.kind==='suppress'?-3:3):0,bonus=a.effect?.boost?3:0;
    const quote=delta=>round(Math.max(10,before+delta));
    const without=quote(natural),afterAccelerate=quote(accelerated),afterStabilize=quote(shaped),withBase=quote(shaped+base);
    a.price=quote(shaped+base+bonus);
    const parts=[{label:'Market forces',amount:round(without-before)}];
    // Group simultaneous shaping so its interaction is not presented as two
    // independent contributions. Never render the hidden valuation input.
    const shaping=round(afterStabilize-without);
    if(a.accelerate||a.stabilize)parts.push({label:a.accelerate&&a.stabilize?'Accelerate + Stabilize':a.accelerate?'Accelerate':'Stabilize',amount:shaping});
    if(a.effect)parts.push({label:labels[a.effect.kind],amount:round(withBase-afterStabilize)});
    if(a.effect?.boost)parts.push({label:'Informed Influence',amount:round(a.price-withBase)});
    a.movement={step:s.step,before,without,parts,actual:round(a.price-before),powered:!!(a.effect||a.accelerate||a.stabilize)};
    a.stabilize=false;a.accelerate=false;
    a.history.push(a.price);a.pressure=round(a.pressure*.65);
    if(a.effect&&--a.effect.remaining===0)a.effect=null;
   });
   record(s,`Discarded: ${unused||'none'}. Market advanced to tick ${s.step}.${event?' New public news.':''}${s.assets.some(a=>a.revealUntil===s.step)?' A revelation expired.':''}`);
   if(s.step===steps){s.assets.forEach(a=>{if(a.qty){const q=a.qty,p=sell(s,a,q);s.log.unshift({step:s.step,text:`Closing sale: ${q} ${a.name}; realised profit $${p.toFixed(2)} after fee.`});}});s.ended=true;s.message='Experiment complete. All remaining shares were sold at closing quotes with the 0.5% fee.';}else draw(s);
  }
  if(s.targetStep===null&&equity(s)>=1100)s.targetStep=s.step;return s;
 }

 const labels={investigate:'Investigate',influence:'Influence',suppress:'Suppress',stabilize:'Stabilize',accelerate:'Accelerate',extend:'Extend',echo:'Echo'};
 const descriptionsByCard={
  investigate:'Reveal live underlying value now and through the next two results. Hides on the third tick.',
  influence:'+$3 per tick for 3 ticks. If revealed at activation: +$6 per tick, locked in. Cannot replace active pressure.',
  suppress:'−$3 per tick for 3 ticks. Underlying value stays unchanged. Cannot replace active pressure.',
  stabilize:'Halve natural market movement next tick—both rises and falls. Card pressure applies afterwards.',
  accelerate:'Double correction toward underlying value next tick. News pressure and fluctuations stay unchanged.',
  extend:'Add 1 tick to active Influence or Suppress. Each pressure effect can be extended only once.',
  echo:'Use as your second play. Repeat your first card on a different eligible company; its conditions are checked again.'
 };
 function shuffle(s,cards){
  const pile=[...cards];
  for(let i=pile.length-1;i>0;i--){s.seed=(Math.imul(1664525,s.seed)+1013904223)>>>0;const j=Math.floor(s.seed/4294967296*(i+1));[pile[i],pile[j]]=[pile[j],pile[i]];}
  return pile;
 }
 function draw(s){while(s.hand.length<3){if(!s.deck.length){if(!s.discard.length)break;s.deck=shuffle(s,s.discard);s.discard=[];s.reshuffles++;}s.hand.push(s.deck.pop());}}
 function initial(scenarioSeed=1){const s=baseInitial();Object.assign(s,{scenarioSeed,events:makeEvents(scenarioSeed),seed:260926,deck:[],discard:[],hand:[],played:[],cardsPlayed:0,reshuffles:0,turnHistory:[],guided:false});s.deck=shuffle(s,Object.keys(labels).flatMap(c=>[c,c]));draw(s);s.message='Draw three, play up to two. Choose a company, trade freely, and decide which card to leave behind.';return s;}
 function targetReason(s,kind,index){
  const a=s.assets[index];if(!a)return 'Choose a company.';
  if(kind==='investigate'&&revealed(s,a))return 'Already revealed; choose another company.';
  if((kind==='influence'||kind==='suppress')&&a.effect)return 'Pressure already active; choose another company.';
  if(kind==='stabilize'&&a.stabilize)return 'Already stabilized for the next tick.';
  if(kind==='accelerate'&&a.accelerate)return 'Already accelerated for the next tick.';
  if(kind==='extend'&&!a.effect)return 'Needs active Influence or Suppress.';
  if(kind==='extend'&&a.effect.extended)return 'This pressure effect has already been extended.';
  return '';
 }
 function cardReason(s,index,asset){
  if(s.ended)return 'Session complete.';
  if(s.played.length>=2)return 'Two cards played. End the turn for a fresh hand.';
  const card=s.hand[index];if(!card)return 'Choose a card in your hand.';
  if(card==='echo'){
   if(s.played.length!==1)return 'Play another card first.';
   if(s.played[0].asset===asset)return 'Echo needs a different company.';
   return targetReason(s,s.played[0].kind,asset);
  }
  return targetReason(s,card,asset);
 }
 function applyCard(s,kind,index){const a=s.assets[index];
  if(kind==='investigate')a.revealUntil=s.step+3;
  if(kind==='influence'||kind==='suppress'){const boost=kind==='influence'&&revealed(s,a);a.effect={kind,remaining:3,amount:kind==='suppress'?-3:boost?6:3,boost,extended:false};if(boost)s.boosts++;}
  if(kind==='stabilize')a.stabilize=true;
  if(kind==='accelerate')a.accelerate=true;
  if(kind==='extend'){a.effect.remaining++;a.effect.extended=true;}
 }
 function effectText(s,a){return [revealed(s,a)?`Revealed until tick ${a.revealUntil}.`:'',a.effect?`${labels[a.effect.kind]}: ${a.effect.amount>0?'+':''}$${a.effect.amount} for ${a.effect.remaining} ticks${a.effect.boost?' (Informed Influence)':''}${a.effect.extended?', extended':''}.`:'',a.stabilize?'Stabilize next tick.':'',a.accelerate?'Accelerate next tick.':''].filter(Boolean).join(' ')||'No active effects.';}
 return {steps,initial,act,fee,round,revealed,equity,labels,descriptionsByCard,cardReason,effectText};
})();

</script>
<script>
const $=id=>document.getElementById(id), money=n=>'$'+n.toFixed(2),signed=n=>(n<0?'−':'+')+money(Math.abs(n)),tickers=['FRG','HBR','LMN'],icons=['◇','≋','ϟ'];

ebug inspection · spoilers</summary><p>Opening marks this session debug-assisted.</p><pre id="debug-state" class="audit"></pre></details></div></div>`;}

let armed=null;

Object.assign(names,{A:'Asset desk · standard',B:'Company board · game-like',C:'Tactics table · most gamified'});
function spark(a){

 return `<svg class="spark" viewBox="0 0 310 95" role="img" aria-label="${a.name} price history. Actual ${money(a.price)}${m?', without this tick’s cards '+money(m.without):', no prior tick'}"><text x="1" y="14">${money(hi-2)}</text><text x="1" y="74">${money(lo+2)}</text><line x1="32" y1="78" x2="288" y2="78" stroke="currentColor" opacity=".25"/><polyline points="${a.history.map((p,i)=>`${x(i)},${y(p)}`).join(' ')}" fill="none" stroke="currentColor" stroke-width="2"/>${m?`<line x1="${x(state.step)}" y1="${y(a.price)}" x2="${x(state.step)}" y2="${y(m.without)}" stroke="#eac780" stroke-width="2" stroke-dasharray="3 2"/><circle cx="${x(state.step)}" cy="${y(m.without)}" r="5" fill="var(--panel)" stroke="#eac780" stroke-width="2"/>`:''}<circle cx="${x(state.step)}" cy="${y(a.price)}" r="3" fill="currentColor"/><text x="32" y="92">Opening</text><text x="240" y="92">Tick 12</text></svg><div class="chart-key">● Actual quote <span>○ Without this tick’s cards</span></div>`;

function Companies(){return `<div class="company-board">${state.assets.map((a,i)=>`<article class="company-tile ${selection===i?'is-target':''}">${assetHeader(a,i)}<div class="company-banner"><span>${icons[i]}</span><div><small>Capital committed</small><strong>${money(a.qty*a.price)} <small>/ ${pct(a)}% of wealth</small></strong><div class="exposure"><span style="width:${pct(a)}%"></span></div></div></div>${quoteBlock(a)}${position(a)}${localTrade(a,i)}${breakdown(a)}${assetPowers(a)}${evidence(a,i)}</article>`).join('')}</div><section class="panel hand-panel">${hand()}</section>`;}
function arsenal(){return `<section class="arsenal"><div><span class="eyebrow">1 / Choose a card</span><h2>Your hand · ${state.ended?0:2-state.played.length} plays left</h2><p class="hand-note">${armed===null?'Select a card to see where it can be played.':'Selected: '+Engine.labels[state.hand[armed]]+'. Choose a company’s play button below.'}</p><p class="hand-note">End turn discards: ${state.hand.map(c=>Engine.labels[c]).join(', ')||'none'}.</p>${state.played.length?`<p class="hand-note">Played: ${state.played.map(p=>Engine.labels[p.card]+' → '+state.assets[p.asset].name).join('; ')}.</p>`:''}</div><div class="tactic-hand">${state.hand.map((c,i)=>`<button class="tactic ${armed===i?'armed':''}" data-arm="${i}" aria-pressed="${armed===i}" ${state.ended||state.played.length>=2?'disabled':''}><span class="eyebrow">${armed===i?'Selected card':'Select card'}</span><strong>${Engine.labels[c]}</strong><span>${Engine.descriptionsByCard[c]}</span></button>`).join('')}</div></section>`;}
function Tactics(){return `${arsenal()}<div class="table-caption"><span class="eyebrow">2 / Play onto a company · trade within its territory</span><span class="muted">Targets glow when the selected card can be played</span></div><div class="territories">${state.assets.map((a,i)=>`<article class="territory ${selection===i?'is-target':''} ${armed!==null&&!Engine.cardReason(state,armed,i)?'eligible':''}"><div class="territory-title"><span class="crest">${icons[i]}</span>${assetHeader(a,i)}</div>${targeting(a,i)}<div class="territory-body"><div class="territory-market">${quoteBlock(a)}${position(a)}${localTrade(a,i)}</div><div class="territory-story">${evidence(a,i)}${assetPowers(a)}</div><div class="territory-math">${breakdown(a)}</div></div></article>`).join('')}</div>`;}
function render(){
 const opened=[...document.querySelectorAll('details[data-keep][open]')].map(d=>d.dataset.keep);
 document.body.className={A:'round-two desk-scene',B:'round-two companies-scene',C:'round-two tactics-scene'}[variant];
 $('scene-name').textContent=variant+' / '+names[variant];
 $('app').innerHTML=`<div class="shell"><header class="mast"><div><div class="eyebrow">Presentation round 02 / ${variant==='A'?'01 · Standard':variant==='B'?'02 · Game board':'03 · Tactics table'}</div><h1>${{A:'The asset desk',B:'Three companies. Your capital.',C:'A hand to change the market.'}[variant]}</h1><small>One company, one place. Same market rules in every scene.</small></div><div class="edition">SCENARIO ${state.scenarioSeed}<br>${state.ended?'CLOSED':`TURN ${state.step+1} / 12`} · TICK ${state.step}<br>THROWAWAY · IN-MEMORY${state.debug?' · DEBUG-ASSISTED':''}</div></header><details class="session" data-keep="session"><summary>Session controls / replay or change seed</summary><p>Compare three degrees of game presentation. Switching preserves play. Reloading resets the run.</p><div class="toolbar"><label for="seed">Scenario seed</label><input id="seed" type="number" min="1" max="999999" value="${state.scenarioSeed}"><button id="load">Load seed</button><button id="restart">Replay current seed</button><button id="new">New scenario</button></div></details><section class="metrics"><div><small>Cash to trade</small><strong>${money(state.cash)}</strong></div><div><small>Total wealth</small><strong>${money(Engine.equity(state))}</strong></div><div><small>Profit / $100 target</small><strong class="${Engine.equity(state)<1000?'down':'up'}">${signed(Engine.round(Engine.equity(state)-1000))}</strong></div><div><small>Card plays left</small><strong>${state.ended?0:2-state.played.length}</strong></div><div class="end"><small>${state.ended?'All shares settled':`Tick ${state.step}/12 · discard ${state.hand.length} cards on end turn`}</small><button id="advance" class="primary" ${state.ended?'disabled':''}>${state.ended?'Session closed':state.step===11?'End turn & settle →':'End turn →'}</button></div></section><div class="notice" role="status" aria-live="polite">${state.message}</div>${state.ended?`<section class="result"><h2>Closing profit ${signed(Engine.round(state.cash-1000))}</h2><p>${state.cardsPlayed} cards played · ${state.trades} trades · ${money(state.fees)} fees. Compare this final state freely.</p></section>`:''}${{A:Desk,B:Companies,C:Tactics}[variant]()}<p class="footnote">Unrealized P/L excludes future selling fees. Average entry includes buying fees. Exposure is share value / total wealth. Decorations do not indicate hidden risk, strength, or future outcomes.</p>${archive()}</div>`;
 opened.forEach(k=>{const d=document.querySelector(`[data-keep="${k}"]`);if(d)d.open=true;});
 document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selection=Number(b.dataset.select);render();});
 document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>dispatch({type:'card',index:Number(b.dataset.card),asset:selection}));
 document.querySelectorAll('[data-arm]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.arm);armed=armed===i?null:i;render();});
 document.querySelectorAll('[data-cast]').forEach(b=>b.onclick=()=>{if(armed!==null){selection=Number(b.dataset.cast);dispatch({type:'card',index:armed,asset:selection});}});
 state.assets.forEach((a,i)=>{$('qty-'+i).oninput=e=>{quantities[i]=e.target.value;preview();};$('buy-'+i).onclick=()=>{selection=i;dispatch({type:'buy',asset:i,qty:quantities[i]});};$('sell-'+i).onclick=()=>{selection=i;dispatch({type:'sell',asset:i,qty:quantities[i]});};});
 $('advance').onclick=()=>dispatch({type:'advance'});$('load').onclick=()=>reset(Number($('seed').value));$('restart').onclick=()=>reset(state.scenarioSeed);$('new').onclick=()=>reset(state.scenarioSeed%999999+1);
 $('debug').ontoggle=()=>{if($('debug').open){state.debug=true;$('debug-state').textContent=JSON.stringify(state,null,2);}else $('debug-state').textContent='';};preview();
}
function preview(){state.assets.forEach((a,i)=>{const q=Number(quantities[i]),valid=Number.isSafeInteger(q)&&q>0,gross=Engine.round(q*a.price),fee=Engine.fee(gross);$('preview-'+i).textContent=valid?`Buy ${money(Engine.round(gross+fee))} / sell ${money(Engine.round(gross-fee))} · fee ${money(fee)} (0.5%)`:'Enter a positive whole number of shares.';$('buy-'+i).disabled=state.ended||!valid||gross+fee>state.cash;$('sell-'+i).disabled=state.ended||!valid||q>a.qty;});}
function dispatch(action){state=Engine.act(state,action);if(action.type==='card'||action.type==='advance')armed=null;render();}
function reset(seed){if(!Number.isSafeInteger(seed)||seed<1||seed>999999){document.querySelector('[role=status]').textContent='Choose a whole seed from 1 to 999999.';return;}if((state.step||state.log.length)&&!state.ended&&!confirm('Reset this run? All in-memory progress will be lost.'))return;$('debug').open=false;state=Engine.initial(seed);selection=0;armed=null;quantities.fill('1');render();}

$('previous').onclick=()=>switchScene(-1);$('next').onclick=()=>switchScene(1);document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchScene(e.key==='ArrowLeft'?-1:1);}});render();
</script></body></html>
