const Engine=(()=>{

   1:event(0,'Forge announces an unplanned maintenance stop. Sellers react sharply, but engineers have not established its extent. Findings are due at tick 4.',-2,-2,-11,'Findings tick 4: a contained repair could reverse the selloff; deeper damage could cause another fall.','Initial report · extent unresolved'),

   4:repair?event(0,'Forge engineers find limited damage. The stoppage also enabled an efficiency upgrade. Initial selling overstated the lasting cost.',8,2,14,'Contained repair confirmed. A customer renewal remains undecided; terms update expected tick 8, decision tick 10.'):event(0,'Forge engineers uncover wider damage. The plant will stay shut longer than the initial report suggested.',-20,-2,-15,'Longer shutdown confirmed. A customer renewal remains undecided; terms update expected tick 8, decision tick 10.'),

   9:event(2,'Lumen’s tariff review enters its final stage. Regulators may allow cost recovery or impose a restrictive cap. Ruling at tick 11.',0,0,-2,'Ruling tick 11: cost recovery or a restrictive cap. Current valuation does not reveal the decision.','Policy review · ruling pending'),
   10:renewal?event(0,'Forge secures the customer renewal with additional volume.',12,1,10,'Renewal secured. No further scheduled company report before closing.'):event(0,'Forge’s customer switches suppliers. The lost order reduces the earnings outlook.',-18,-2,-19,'Customer lost. No further scheduled company report before closing.'),
   11:audit?event(2,'Lumen is allowed to recover its costs through tariffs. Harbor’s fuel settlement remains due at closing next tick.',10,1,9,'Cost recovery approved. No further scheduled company report before closing.'):event(2,'Lumen receives a restrictive tariff cap, compressing margins. Harbor’s fuel settlement remains due at closing next tick.',-16,-2,-18,'Restrictive cap confirmed. No further scheduled company report before closing.'),
   12:costs?event(1,'Harbor agrees a favorable fuel settlement. Closing positions settle at the resulting quotes.',12,1,10,'Fuel settlement complete; session closed.'):event(1,'Harbor must absorb a costly fuel settlement. Closing positions settle after the price reaction.',-16,-2,-17,'Fuel settlement complete; session closed.')
  };
 }
 const round=n=>Math.round((n+Number.EPSILON)*100)/100;
 const fee=n=>round(n*.005);
 const baseInitial=()=>({step:0,cash:1000,realized:0,fees:0,ended:false,targetStep:null,debug:false,trades:0,boosts:0,message:'Read the three opportunities, then choose where to commit your cash and powers.',news:[{step:0,text:opening,kind:'Opening brief · unresolved opportunities'}],log:[],assets:names.map((name,i)=>({name,description:descriptions[i],price:100,value:[104,102,108][i],pressure:0,outlook:openingOutlooks[i],qty:0,cost:0,realized:0,revealUntil:0,effect:null,stabilize:false,accelerate:false,history:[100],movement:null}))});
 const revealed=(s,a)=>s.step<a.revealUntil;
 const equity=s=>round(s.cash+s.assets.reduce((n,a)=>n+a.qty*a.price,0));
 const record=(s,text)=>{s.message=text;s.log.unshift({step:s.step,text});};
 function sell(s,a,q){const gross=round(q*a.price),f=fee(gross),basis=q===a.qty?a.cost:round(a.cost*q/a.qty),profit=round(gross-f-basis);s.cash=round(s.cash+gross-f);a.qty-=q;a.cost=round(a.cost-basis);a.realized=round(a.realized+profit);s.realized=round(s.realized+profit);s.fees=round(s.fees+f);return profit;}
 function act(state,action){const s=structuredClone(state),a=s.assets[action.asset];if(s.ended)return s;
  if(action.type==='buy'||action.type==='sell'){
   const q=Number(action.qty);if(!a||!Number.isSafeInteger(q)||q<1){s.message='Choose a positive whole number of shares.';return s;}
   const gross=round(q*a.price),f=fee(gross),total=round(gross+f);
   if(action.type==='buy'){if(!Number.isFinite(total)||total>s.cash){s.message='Not enough cash for these shares and their fee.';return s;}s.cash=round(s.cash-total);a.qty+=q;a.cost=round(a.cost+total);s.fees=round(s.fees+f);record(s,`Bought ${q} ${a.name} for $${total.toFixed(2)}, including $${f.toFixed(2)} fee.`);}
   else{if(q>a.qty){s.message='You do not own that many shares.';return s;}const profit=sell(s,a,q);record(s,`Sold ${q} ${a.name}. Realised profit: $${profit.toFixed(2)} after fees.`);}s.trades++;
  }else if(action.type==='card'){
   const problem=cardReason(s,action.index,action.asset);
   if(problem){s.message=problem;return s;}
   const card=s.hand[action.index],kind=card==='echo'?s.played[0].kind:card;
   applyCard(s,kind,action.asset);
   s.hand.splice(action.index,1);s.discard.push(card);
   s.played.push({card,kind,asset:action.asset});s.cardsPlayed++;
   record(s,`${labels[card]}${card==='echo'?` → ${labels[kind]}`:''} on ${a.name}. ${effectText(s,a)} ${2-s.played.length} card plays left.`);
  }else if(action.type==='advance'){
   const unused=s.hand.map(c=>labels[c]).join(', ');
   s.discard.push(...s.hand);s.hand=[];
   s.turnHistory.push({turn:s.step+1,played:s.played.map(p=>`${labels[p.card]} on ${s.assets[p.asset].name}`),unused});
   s.played=[];
   s.step++;const event=s.events[s.step];if(event){s.news.unshift({step:s.step,text:event.text,kind:event.kind});const target=s.assets[event.asset];target.value+=event.value;target.pressure=event.pressure;target.outlook=event.outlook;}
   s.assets.forEach((a,i)=>{
    const before=a.price,noise=(((s.step*17+i*11)%13)-6)*.12;
    const correction=.12*(a.value-before),natural=correction+a.pressure+noise+(event?.asset===i?event.shock:0);
    const accelerated=natural+(a.accelerate?correction:0);
    const shaped=a.stabilize?accelerated*.5:accelerated;
    const base=a.effect?(a.effect.kind==='suppress'?-3:3):0,bonus=a.effect?.boost?3:0;
    const quote=delta=>round(Math.max(10,before+delta));
    const without=quote(natural),afterAccelerate=quote(accelerated),afterStabilize=quote(shaped),withBase=quote(shaped+base);
    a.price=quote(shaped+base+bonus);
    const parts=[{label:'Market forces',amount:round(without-before)}];
    // Group simultaneous shaping so its interaction is not presented as two
    // independent contributions. Never render the hidden valuation input.
    const shaping=round(afterStabilize-without);
    if(a.accelerate||a.stabilize)parts.push({label:a.accelerate&&a.stabilize?'Accelerate + Stabilize':a.accelerate?'Accelerate':'Stabilize',amount:shaping});
    if(a.effect)parts.push({label:labels[a.effect.kind],amount:round(withBase-afterStabilize)});
    if(a.effect?.boost)parts.push({label:'Informed Influence',amount:round(a.price-withBase)});
    a.movement={step:s.step,before,without,parts,actual:round(a.price-before),powered:!!(a.effect||a.accelerate||a.stabilize)};
    a.stabilize=false;a.accelerate=false;
    a.history.push(a.price);a.pressure=round(a.pressure*.65);
    if(a.effect&&--a.effect.remaining===0)a.effect=null;
   });
   record(s,`Discarded: ${unused||'none'}. Market advanced to tick ${s.step}.${event?' New public news.':''}${s.assets.some(a=>a.revealUntil===s.step)?' A revelation expired.':''}`);
   if(s.step===steps){s.assets.forEach(a=>{if(a.qty){const q=a.qty,p=sell(s,a,q);s.log.unshift({step:s.step,text:`Closing sale: ${q} ${a.name}; realised profit $${p.toFixed(2)} after fee.`});}});s.ended=true;s.message='Experiment complete. All remaining shares were sold at closing quotes with the 0.5% fee.';}else draw(s);
  }
  if(s.targetStep===null&&equity(s)>=1100)s.targetStep=s.step;return s;
 }

 const labels={investigate:'Investigate',influence:'Influence',suppress:'Suppress',stabilize:'Stabilize',accelerate:'Accelerate',extend:'Extend',echo:'Echo'};
 const descriptionsByCard={
  investigate:'Reveal live underlying value now and through the next two results. Hides on the third tick.',
  influence:'+$3 per tick for 3 ticks. If revealed at activation: +$6 per tick, locked in. Cannot replace active pressure.',
  suppress:'−$3 per tick for 3 ticks. Underlying value stays unchanged. Cannot replace active pressure.',
  stabilize:'Halve natural market movement next tick—both rises and falls. Card pressure applies afterwards.',
  accelerate:'Double correction toward underlying value next tick. News pressure and fluctuations stay unchanged.',
  extend:'Add 1 tick to active Influence or Suppress. Each pressure effect can be extended only once.',
  echo:'Use as your second play. Repeat your first card on a different eligible company; its conditions are checked again.'
 };
 function shuffle(s,cards){
  const pile=[...cards];
  for(let i=pile.length-1;i>0;i--){s.seed=(Math.imul(1664525,s.seed)+1013904223)>>>0;const j=Math.floor(s.seed/4294967296*(i+1));[pile[i],pile[j]]=[pile[j],pile[i]];}
  return pile;
 }
 function draw(s){while(s.hand.length<3){if(!s.deck.length){if(!s.discard.length)break;s.deck=shuffle(s,s.discard);s.discard=[];s.reshuffles++;}s.hand.push(s.deck.pop());}}
 function initial(scenarioSeed=1){const s=baseInitial();Object.assign(s,{scenarioSeed,events:makeEvents(scenarioSeed),seed:260926,deck:[],discard:[],hand:[],played:[],cardsPlayed:0,reshuffles:0,turnHistory:[],guided:false});s.deck=shuffle(s,Object.keys(labels).flatMap(c=>[c,c]));draw(s);s.message='Draw three, play up to two. Choose a company, trade freely, and decide which card to leave behind.';return s;}
 function targetReason(s,kind,index){
  const a=s.assets[index];if(!a)return 'Choose a company.';
  if(kind==='investigate'&&revealed(s,a))return 'Already revealed; choose another company.';
  if((kind==='influence'||kind==='suppress')&&a.effect)return 'Pressure already active; choose another company.';
  if(kind==='stabilize'&&a.stabilize)return 'Already stabilized for the next tick.';
  if(kind==='accelerate'&&a.accelerate)return 'Already accelerated for the next tick.';
  if(kind==='extend'&&!a.effect)return 'Needs active Influence or Suppress.';
  if(kind==='extend'&&a.effect.extended)return 'This pressure effect has already been extended.';
  return '';
 }
 function cardReason(s,index,asset){
  if(s.ended)return 'Session complete.';
  if(s.played.length>=2)return 'Two cards played. End the turn for a fresh hand.';
  const card=s.hand[index];if(!card)return 'Choose a card in your hand.';
  if(card==='echo'){
   if(s.played.length!==1)return 'Play another card first.';
   if(s.played[0].asset===asset)return 'Echo needs a different company.';
   return targetReason(s,s.played[0].kind,asset);
  }
  return targetReason(s,card,asset);
 }
 function applyCard(s,kind,index){const a=s.assets[index];
  if(kind==='investigate')a.revealUntil=s.step+3;
  if(kind==='influence'||kind==='suppress'){const boost=kind==='influence'&&revealed(s,a);a.effect={kind,remaining:3,amount:kind==='suppress'?-3:boost?6:3,boost,extended:false};if(boost)s.boosts++;}
  if(kind==='stabilize')a.stabilize=true;
  if(kind==='accelerate')a.accelerate=true;
  if(kind==='extend'){a.effect.remaining++;a.effect.extended=true;}
 }
 function effectText(s,a){return [revealed(s,a)?`Revealed until tick ${a.revealUntil}.`:'',a.effect?`${labels[a.effect.kind]}: ${a.effect.amount>0?'+':''}$${a.effect.amount} for ${a.effect.remaining} ticks${a.effect.boost?' (Informed Influence)':''}${a.effect.extended?', extended':''}.`:'',a.stabilize?'Stabilize next tick.':'',a.accelerate?'Accelerate next tick.':''].filter(Boolean).join(' ')||'No active effects.';}
 return {steps,initial,act,fee,round,revealed,equity,labels,descriptionsByCard,cardReason,effectText};
})();

</script><script>// Three fixed-screen compositions; one unchanged market engine and card-first flow.
const $=id=>document.getElementById(id),money=n=>'$'+n.toFixed(2),signed=n=>(n<0?'−':'+')+money(Math.abs(n));
const scenes=['A','B','C'],names={A:'Guild board',B:'Command room',C:'Arcane exchange'},tickers=['FRG','HBR','LMN'],icons=['◇','≋','ϟ'];
const cardIcons={investigate:'◎',influence:'↗',suppress:'↘',stabilize:'⏸',accelerate:'»',extend:'✚',echo:'◈'};
let state=Engine.initial(),selection=0,armed=null,variant=scenes.includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'C',drawerKind=null,returnFocus=null;
const quantities=['1','1','1'];
const pct=a=>Math.round(a.qty*a.price/Engine.equity(state)*100),pl=a=>Engine.round(a.qty*a.price-a.cost);
function delta(a){return a.movement?`<span class="${a.movement.actual<0?'down':'up'}">${a.movement.actual<0?'↓':a.movement.actual>0?'↑':'→'} ${signed(a.movement.actual)}</span>`:'<span class="muted">No prior tick</span>';}
function graph(a){const m=a.movement,lo=Math.min(...a.history,m?.without??a.price)-2,hi=Math.max(...a.history,m?.without??a.price)+2,x=i=>38+i*248/12,y=p=>60-(p-lo)/(hi-lo)*48;return `<svg viewBox="0 0 300 80" role="img" aria-label="${a.name} quote history; current ${money(a.price)}${m?', without this tick’s cards '+money(m.without):', opening quote'}"><text x="0" y="13">${money(hi-2)}</text><text x="0" y="65">${money(lo+2)}</text><line x1="38" x2="289" y1="65" y2="65" stroke="currentColor" opacity=".2"/><polyline points="${a.history.map((p,i)=>`${x(i)},${y(p)}`).join(' ')}" fill="none" stroke="currentColor" stroke-width="2"/>${m?`<line x1="${x(state.step)}" x2="${x(state.step)}" y1="${y(a.price)}" y2="${y(m.without)}" stroke="#e4bc78" stroke-dasharray="3 2"/><circle cx="${x(state.step)}" cy="${y(m.without)}" r="4" fill="var(--panel)" stroke="#e4bc78" stroke-width="2"/>`:''}<circle cx="${x(state.step)}" cy="${y(a.price)}" r="2.5" fill="currentColor"/><text x="38" y="78">Opening</text><text x="253" y="78">Tick 12</text></svg>`;}
function effects(a){const parts=[];if(a.effect)parts.push(`${Engine.labels[a.effect.kind]} ${signed(a.effect.amount)} · ${a.effect.remaining}t`);if(a.stabilize)parts.push('Stabilize · 1t');if(a.accelerate)parts.push('Accelerate · 1t');if(Engine.revealed(state,a))parts.push(`◎ Value ${money(a.value)} · ${a.revealUntil-state.step}t`);return parts.length?parts.map(p=>`<span>${p}</span>`).join(''):'<span class="muted">No active powers · value hidden</span>';}
function contributions(a){const m=a.movement;return `<section class="contributions"><div class="section-label">Price contributions <span>${m?'tick '+m.step:'opening'}</span></div><div class="parts">${m?m.parts.map(p=>`<div><span>${p.label}</span><b class="${p.amount<0?'down':'up'}">${signed(p.amount)}</b></div>`).join(''):`<p class="muted">No prior tick. End turn to resolve movement.</p>`}</div><div class="counterfactual"><span>○ Without this tick’s cards</span><b>${m?money(m.without):'—'}</b></div><div class="card-delta"><span>Cards’ effect / same starting quote</span><b>${m?signed(Engine.round(a.price-m.without)):'—'}</b></div></section>`;}
function nextReport(a){const ts=[...a.outlook.matchAll(/tick (\d+)/gi)].map(m=>Number(m[1])).filter(t=>t>state.step);if(/next tick/i.test(a.outlook))ts.push(state.step+1);return ts.length?'Report T'+Math.min(...ts)+' · '+(Math.min(...ts)-state.step)+'t away':state.ended?'Market closed':'No announced report';}
function company(a,i){const last=state.news.find(n=>n.step>0&&n.text.startsWith(['Forge','Harbor','Lumen'][i]));const headline=last?last.text.split('. ')[0]+'.':a.outlook.split('. ')[0]+'.';const reason=armed===null?'Choose a card from your hand first.':Engine.cardReason(state,armed,i),active=armed!==null&&!reason;return `<article class="company ${active?'eligible':''} ${selection===i?'mobile-active':''}" aria-label="${a.name}"><header class="company-head"><span class="crest">${icons[i]}</span><div><small>${tickers[i]} / ${['INDUSTRY','TRANSPORT','ENERGY'][i]}</small><h2>${a.name}</h2></div><button class="icon-button" id="dossier-${i}" data-menu="asset-${i}" aria-label="${a.name} dossier">ⓘ</button></header><div class="quote"><strong>${money(a.price)}</strong><div><small>Previous ${a.movement?money(a.movement.before):'—'}</small><b>${delta(a)}</b></div></div><div class="chart">${graph(a)}<div class="chart-key"><span>● Actual price</span><span>○ Without tick’s cards</span></div></div><section class="holdings"><div><small>Owned / exposure</small><b>${a.qty} shares · ${pct(a)}%</b></div><div><small>Avg entry · incl. fee</small><b>${a.qty?money(a.cost/a.qty):'—'}</b></div><div><small>Position value</small><b>${money(a.qty*a.price)}</b></div><div><small>Unrealized P/L*</small><b class="${pl(a)<0?'down':'up'}">${signed(pl(a))}</b></div></section>${contributions(a)}<div class="power-strip" aria-label="Active powers">${effects(a)}</div><button class="brief" data-menu="asset-${i}" id="brief-${i}"><strong>${nextReport(a)} <span>Brief ↗</span></strong><span>${headline}</span></button><section class="local-trade"><div class="trade-line"><label for="qty-${i}">Shares</label><input id="qty-${i}" type="number" min="1" step="1" value="${quantities[i]}" aria-label="${a.name} share quantity"><button id="buy-${i}" aria-label="Buy ${a.name}">Buy</button><button id="sell-${i}" aria-label="Sell ${a.name}">Sell</button></div><p id="preview-${i}" class="preview"></p></section><button class="cast" id="cast-${i}" title="${reason||'Play on '+a.name}" ${reason?'disabled':''}>${armed===null?'◇ Choose a card first':`${cardIcons[state.hand[armed]]} Play ${Engine.labels[state.hand[armed]]} here`}</button><small class="target-reason">${armed===null?'Trade freely, or select a card.':reason||'Target: '+a.name+(state.hand[armed]==='influence'?' · +$'+(Engine.revealed(state,a)?6:3)+'/tick':'')}</small></article>`;}
function hand(){return `<section class="hand-zone"><div class="hand-heading"><div><small>1 / SELECT CARD → 2 / SELECT COMPANY</small><h2>${armed===null?'Your hand':Engine.labels[state.hand[armed]]+' selected'} <span>${state.ended?0:2-state.played.length}/2 plays left</span></h2></div><button id="cancel-card" ${armed===null?'disabled':''}>Cancel selection</button><p>End turn discards: ${state.hand.map(c=>Engine.labels[c]).join(', ')||'none'}.</p></div><div class="hand">${state.hand.map((c,i)=>`<div class="card ${armed===i?'armed':''}"><button class="pick-card" id="card-${i}" aria-pressed="${armed===i}" ${state.ended||state.played.length>=2?'disabled':''}><span class="card-icon" aria-hidden="true">${cardIcons[c]}</span><div><strong>${Engine.labels[c]}</strong><span>${Engine.descriptionsByCard[c]}</span></div></button><button class="card-info" id="card-info-${i}" data-menu="card-${i}" aria-label="${Engine.labels[c]} full description">ⓘ</button></div>`).join('')||'<p class="muted">No cards remain. Finish your trades, then end turn.</p>'}</div></section>`;}
function render(){const focused=document.activeElement?.id;document.body.className='scene-'+variant;$('app').innerHTML=`<header class="hud"><div class="brand"><span class="brand-icon">◈</span><div><small>ROUND 03 · THROWAWAY</small><h1>${names[variant]}</h1></div></div><div class="resources"><div><small>Cash</small><b>${money(state.cash)}</b></div><div><small>Wealth</small><b>${money(Engine.equity(state))}</b></div><div><small>Profit / $100</small><b class="${Engine.equity(state)<1000?'down':'up'}">${signed(Engine.round(Engine.equity(state)-1000))}</b></div></div><button id="session" data-menu="session">☷ Menu</button><button id="advance" class="primary" ${state.ended?'disabled':''}>${state.ended?'Closed':state.step===11?'Settle turn 12 →':`End turn ${state.step+1}/12 →`}</button></header><div class="status-line"><span class="status" role="status" aria-live="polite">${state.message}</span><button id="activity" data-menu="activity">Activity ↗</button></div><div class="mobile-quotes">${state.assets.map((a,i)=>`<button id="mobile-${i}" aria-pressed="${selection===i}"><b>${tickers[i]} ${money(a.price)}</b><small>Prev ${a.movement?money(a.movement.before):'—'} · ${a.movement?signed(a.movement.actual):'opening'}</small></button>`).join('')}</div><main class="workspace"><section class="companies">${state.assets.map(company).join('')}</section>${hand()}</main><footer><span>*Open P/L excludes selling fees · 0.5% per trade</span><nav class="switcher" aria-label="Presentation scenes"><button id="previous" aria-label="Previous scene">←</button><div><b>${variant} / ${names[variant]}</b><small>Same live game · ← → to compare</small></div><button id="next" aria-label="Next scene">→</button></nav><button id="news" data-menu="news">News archive ↗</button></footer>`;
 document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.menu,b.id));
 state.assets.forEach((a,i)=>{$('qty-'+i).oninput=e=>{quantities[i]=e.target.value;preview();};$('buy-'+i).onclick=()=>dispatch({type:'buy',asset:i,qty:quantities[i]});$('sell-'+i).onclick=()=>dispatch({type:'sell',asset:i,qty:quantities[i]});$('cast-'+i).onclick=()=>{if(armed!==null){selection=i;dispatch({type:'card',asset:i,index:armed});}};$('mobile-'+i).onclick=()=>{selection=i;render();};});
 state.hand.forEach((c,i)=>$('card-'+i).onclick=()=>{armed=armed===i?null:i;render();});$('cancel-card').onclick=()=>{armed=null;render();};$('advance').onclick=()=>dispatch({type:'advance'});$('previous').onclick=()=>switchScene(-1);$('next').onclick=()=>switchScene(1);preview();if(focused)$(focused)?.focus({preventScroll:true});}
function preview(){state.assets.forEach((a,i)=>{const q=Number(quantities[i]),valid=Number.isSafeInteger(q)&&q>0,gross=Engine.round(q*a.price),fee=Engine.fee(gross);$('preview-'+i).textContent=valid?`Buy ${money(Engine.round(gross+fee))} · sell ${money(Engine.round(gross-fee))} · fee ${money(fee)}`:'Enter positive whole shares.';$('buy-'+i).disabled=state.ended||!valid||gross+fee>state.cash;$('sell-'+i).disabled=state.ended||!valid||q>a.qty;});}
function dispatch(action){state=Engine.act(state,action);if(action.type==='card'||action.type==='advance')armed=null;render();}
function switchScene(dir){variant=scenes[(scenes.indexOf(variant)+dir+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);try{history.replaceState(null,'',url);}catch{}render();}
function openDrawer(kind,from){drawerKind=kind;returnFocus=from;fillDrawer();$('drawer').showModal();$('close-drawer').focus();}
function closeDrawer(){$('drawer').close();drawerKind=null;if(returnFocus)$(returnFocus)?.focus({preventScroll:true});}
function fillDrawer(){let title='',body='';if(drawerKind.startsWith('asset-')){const i=Number(drawerKind.split('-')[1]),a=state.assets[i],past=state.news.filter(n=>n.step>0&&n.text.startsWith(['Forge','Harbor','Lumen'][i]));title=a.name+' / dossier';body=`<h3>Known / public evidence</h3><p>${past[0]?.text||a.description+' No company report has resolved yet.'}</p><h3>Unresolved / upcoming reports</h3><p>${a.outlook}</p><h3>Active powers</h3><p>${Engine.effectText(state,a)}</p>${Engine.revealed(state,a)?`<p>Current investigated value ${money(a.value)}. ${a.revealUntil-state.step} ticks remaining. This does not reveal future outcomes.</p>`:'<p>Current value hidden. Investigate to reveal.</p>'}<h3>How to read the chart</h3><p>The hollow marker and “without this tick’s cards” quote exclude the current tick’s price cards, starting from the same previous quote. Earlier card effects are still part of that starting quote. This is not a whole-run counterfactual.</p><p>Contributions include rounding and the $10 floor. The graph uses a local scale per company; compare numeric prices and movement for magnitude.</p><h3>Company report history</h3>${past.map(n=>`<article><small>Tick ${n.step} · ${n.kind}</small><p>${n.text}</p></article>`).join('')||'<p>No resolved reports.</p>'}`;}else if(drawerKind.startsWith('card-')){const c=state.hand[Number(drawerKind.split('-')[1])];title=cardIcons[c]+' '+Engine.labels[c];body=`<p>${Engine.descriptionsByCard[c]}</p><p>Select the card, then click a company’s play button. Selection alone does not spend a play.</p>${c==='echo'&&state.played.length===1?`<p>Copies ${Engine.labels[state.played[0].kind]}. Choose a different company than ${state.assets[state.played[0].asset].name}.</p>`:''}`;}else if(drawerKind==='news'){title='Public news archive';body=state.news.map(n=>`<article><small>Tick ${n.step} · ${n.kind}</small><p>${n.text}</p></article>`).join('');}else if(drawerKind==='activity'){title='Activity & accounting';body=`<p>Realized P/L ${signed(state.realized)} · fees ${money(state.fees)} · seed ${state.scenarioSeed}${state.debug?' · debug-assisted':''}.</p><h3>Played this turn</h3><p>${state.played.map(p=>Engine.labels[p.card]+' on '+state.assets[p.asset].name).join('; ')||'None'}</p>${state.log.map(n=>`<article><small>After tick ${n.step}</small><p>${n.text}</p></article>`).join('')}<h3>Past hands</h3>${state.turnHistory.map(t=>`<p>Turn ${t.turn} · played ${t.played.join('; ')||'none'} · discarded ${t.unused||'none'}</p>`).join('')}`;}else{title='Session & reference';body=`<p>Three fixed-screen presentations, one live game. All scenes use card-first targeting. Reloading starts a new run; only ?variant=A/B/C survives.</p><div class="session-controls"><label for="seed">Scenario seed</label><input id="seed" type="number" min="1" max="999999" value="${state.scenarioSeed}"><button id="load-seed">Load seed</button><button id="replay">Replay current seed</button><button id="new-seed">New scenario</button></div><h3>Rules</h3><p>12 turns. $1,000 capital. $100 profit reference target. Trade freely at current quotes with 0.5% fees. Draw three cards, play up to two, discard all unused cards at end turn. At tick 12, remaining shares settle automatically with selling fees.</p><p>Reports and price reactions arrive together. Draw order and future outcomes stay hidden. No borrowing or shorting. Progress is in memory only.</p><h3>Cards</h3>${Object.entries(Engine.descriptionsByCard).map(([c,d])=>`<p><b>${cardIcons[c]} ${Engine.labels[c]}:</b> ${d}</p>`).join('')}<p>Draw ${state.deck.length} · discard ${state.discard.length} · reshuffles ${state.reshuffles}.</p><details><summary>Public comparison state</summary><pre>${JSON.stringify({tick:state.step,seed:state.scenarioSeed,cash:state.cash,hand:state.hand,played:state.played,armedCard:armed===null?null:state.hand[armed],assets:state.assets.map(a=>({name:a.name,quote:a.price,previous:a.movement?.before??null,qty:a.qty,cost:a.cost,outlook:a.outlook,powers:Engine.effectText(state,a),...(Engine.revealed(state,a)?{value:a.value}:{})}))},null,2)}</pre></details><details id="debug"><summary>Debug inspection · spoilers</summary><p>Opening marks this session debug-assisted.</p><pre id="debug-state"></pre></details>`;}$('drawer-title').textContent=title;$('drawer-content').innerHTML=body;if(drawerKind==='session'){$('load-seed').onclick=()=>reset(Number($('seed').value));$('replay').onclick=()=>reset(state.scenarioSeed);$('new-seed').onclick=()=>reset(state.scenarioSeed%999999+1);$('debug').ontoggle=()=>{if($('debug').open){state.debug=true;$('debug-state').textContent=JSON.stringify(state,null,2);}else $('debug-state').textContent='';};}}
function reset(seed){if(!Number.isSafeInteger(seed)||seed<1||seed>999999){$('seed').setCustomValidity('Use a whole seed from 1 to 999999.');$('seed').reportValidity();return;}if((state.step||state.log.length)&&!state.ended&&!confirm('Reset this run? In-memory progress will be lost.'))return;state=Engine.initial(seed);armed=null;selection=0;quantities.fill('1');closeDrawer();render();}
$('close-drawer').onclick=closeDrawer;$('drawer').addEventListener('cancel',e=>{e.preventDefault();closeDrawer();});$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))closeDrawer();});
document.addEventListener('keydown',e=>{if($('drawer').open||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='Escape'&&armed!==null){armed=null;render();}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchScene(e.key==='ArrowLeft'?-1:1);}});render();
</script></body></html>
