     create offense/defense decisions, and what should its telegraph reveal?

     2 turns; bait combo: joined pump -> Halt -> Dump (40%). Boss numbers (pump +$5/tick for 2-4 ticks, dump -$6 per pumped tick,

.boss-holds{color:var(--muted);white-space:nowrap}.boss-holds b{color:var(--ink)}
.boss-intent{flex:1;display:flex;gap:.5rem;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.boss-intent>small{color:var(--muted)}.threat{border:1px solid #ffb5a5aa;background:#ffb5a518;color:#ffd3c8;border-radius:.3rem;padding:.12rem .45rem;font-weight:700}
.threat.quiet{border-color:var(--line);background:none;color:var(--muted);font-weight:400}.boss-strip button{font-size:.72rem;white-space:nowrap}

.wiretap-on{color:var(--accent);font-weight:700}.score b.lead{color:var(--up)}.score b.trail{color:var(--down)}
@media(max-width:900px){.boss-strip{flex-wrap:wrap;gap:.2rem .6rem;padding:.25rem .5rem;font-size:.66rem}.boss-name{font-size:.85rem}.boss-name small{display:none}.boss-intent{flex-basis:100%;order:3}}
</style></head><body><div id="app"></div><dialog id="drawer" aria-labelledby="drawer-title"><div class="drawer-shell"><header class="drawer-head"><h2 id="drawer-title"></h2><button id="close-drawer" aria-label="Close panel">×</button></header><div class="drawer-content" id="drawer-content"></div></div></dialog><script id="market-engine">
// Pure, deterministic state transitions. No DOM and no trading-dependent randomness.
const Engine=(()=>{
 const steps=12;
 const names=['Forge Works','Harbor Freight','Lumen Grid'];
 const descriptions=['Makes machinery. Orders help its business; high energy costs hurt margins.','Moves cargo. Reopening routes helps deliveries; congestion creates delays.','Supplies power. Strong demand helps earnings; price caps can limit them.'];
 const opening='Three unresolved stories: Forge faces a maintenance review, Lumen is bidding for a power contract, and Harbor is testing a new route. Reports arrive separately; initial reactions can overstate or understate the eventual outcome.';
 const openingOutlooks=[
  'Maintenance review due tick 1; engineering findings tick 4. Repairs may be limited or expose a longer shutdown. A sharp initial fall need not mean recovery is coming.',
  'Route pilot report due tick 3; operating results tick 7. Early interest may become repeat business or fail to cover costs.',
  'Contract shortlist due tick 2; award decision tick 5. Enthusiasm can reverse abruptly if the bid loses.'
 ];
 function makeEvents(seed){
  let rng=(seed^0x9e3779b9)>>>0;
  const flip=()=>{rng=(rng+0x6d2b79f5)>>>0;let n=rng;n=Math.imul(n^(n>>>15),n|1);n^=n+Math.imul(n^(n>>>7),n|61);return ((n^(n>>>14))>>>0)/4294967296<.5;};
  const repair=flip(),contract=flip(),route=flip(),renewal=flip(),audit=flip(),costs=flip();
  const event=(asset,text,value,pressure,shock,outlook,kind='Confirmed report')=>({asset,text,value,pressure,shock,outlook,kind});
  return {
   1:event(0,'Forge announces an unplanned maintenance stop. Sellers react sharply, but engineers have not established its extent. Findings are due at tick 4.',-2,-2,-11,'Findings tick 4: a contained repair could reverse the selloff; deeper damage could cause another fall.','Initial report · extent unresolved'),
   2:event(2,'Lumen makes the contract shortlist. Buyers rush in, although the award is still contested. Decision due tick 5.',0,2,9,'Award tick 5: winning supports earnings; losing could erase the shortlist rally.','Shortlist · not an award'),
   3:event(1,'Harbor’s route pilot attracts customers. Management has not yet established whether repeat orders cover operating costs. Results due tick 7.',0,.5,1,'Operating results tick 7: repeat customers may support expansion, or weak margins may make it unviable.','Pilot update · economics unresolved'),
   4:repair?event(0,'Forge engineers find limited damage. The stoppage also enabled an efficiency upgrade. Initial selling overstated the lasting cost.',8,2,14,'Contained repair confirmed. A customer renewal remains undecided; terms update expected tick 8, decision tick 10.'):event(0,'Forge engineers uncover wider damage. The plant will stay shut longer than the initial report suggested.',-20,-2,-15,'Longer shutdown confirmed. A customer renewal remains undecided; terms update expected tick 8, decision tick 10.'),
   5:contract?event(2,'Lumen wins the contract, improving its earnings outlook. The early rally had anticipated some of this success.',15,1,7,'Contract won. A tariff review can still affect margins; scope update tick 9, ruling tick 11.'):event(2,'Lumen loses the contract. Buyers unwind positions built during the shortlist rally; the price gaps down before new trades can be placed.',-18,-3,-22,'Bid lost. A tariff review can still affect margins; scope update tick 9, ruling tick 11.'),
   6:event(1,'Harbor sees repeat bookings, but fuel and overtime costs remain unsettled. The operating report at tick 7 will determine whether this is profitable growth.',0,.5,0,'Operating results next tick. Bookings alone do not establish profit.','Public evidence · outcome unresolved'),
   7:route?event(1,'Harbor’s pilot earns a sustainable margin. Repeat orders justify expanding the route.',16,2,11,'Profitable route confirmed. A fuel-supply settlement is still open and will resolve at closing tick 12.'):event(1,'Harbor’s pilot loses money despite repeat bookings. Operating costs exceed what customers will pay.',-16,-2,-14,'Loss-making pilot confirmed. A fuel-supply settlement is still open and will resolve at closing tick 12.'),
   8:event(0,'Forge’s largest customer is negotiating a renewal. Volume could increase, but the customer is also considering another supplier. Decision at tick 10.',0,0,0,'Renewal tick 10: a larger order or a lost customer. Current valuation does not reveal the decision.','Negotiations · no agreement'),
   9:event(2,'Lumen’s tariff review enters its final stage. Regulators may allow cost recovery or impose a restrictive cap. Ruling at tick 11.',0,0,-2,'Ruling tick 11: cost recovery or a restrictive cap. Current valuation does not reveal the decision.','Policy review · ruling pending'),
   10:renewal?event(0,'Forge secures the customer renewal with additional volume.',12,1,10,'Renewal secured. No further scheduled company report before closing.'):event(0,'Forge’s customer switches suppliers. The lost order reduces the earnings outlook.',-18,-2,-19,'Customer lost. No further scheduled company report before closing.'),
   11:audit?event(2,'Lumen is allowed to recover its costs through tariffs. Harbor’s fuel settlement remains due at closing next tick.',10,1,9,'Cost recovery approved. No further scheduled company report before closing.'):event(2,'Lumen receives a restrictive tariff cap, compressing margins. Harbor’s fuel settlement remains due at closing next tick.',-16,-2,-18,'Restrictive cap confirmed. No further scheduled company report before closing.'),
   12:costs?event(1,'Harbor agrees a favorable fuel settlement. Closing positions settle at the resulting quotes.',12,1,10,'Fuel settlement complete; session closed.'):event(1,'Harbor must absorb a costly fuel settlement. Closing positions settle after the price reaction.',-16,-2,-17,'Fuel settlement complete; session closed.')
  };
 }
 const round=n=>Math.round((n+Number.EPSILON)*100)/100;
 const fee=n=>round(n*.005);
 const baseInitial=()=>({step:0,cash:1000,realized:0,fees:0,ended:false,targetStep:null,debug:false,trades:0,boosts:0,message:'Read the three opportunities, then choose where to commit your cash and powers.',news:[{step:0,text:opening,kind:'Opening brief · unresolved opportunities'}],log:[],assets:names.map((name,i)=>({name,description:descriptions[i],price:100,value:[104,102,108][i],pressure:0,outlook:openingOutlooks[i],qty:0,cost:0,realized:0,revealUntil:0,effect:null,stabilize:false,accelerate:false,history:[100],movement:null,bossEffects:[]}))});
 const revealed=(s,a)=>s.step<a.revealUntil;
 const equity=s=>round(s.cash+s.assets.reduce((n,a)=>n+a.qty*a.price,0));
 const record=(s,text)=>{s.message=text;s.log.unshift({step:s.step,text});};
 function sell(s,a,q){const gross=round(q*a.price),f=fee(gross),basis=q===a.qty?a.cost:round(a.cost*q/a.qty),profit=round(gross-f-basis);s.cash=round(s.cash+gross-f);a.qty-=q;a.cost=round(a.cost-basis);a.realized=round(a.realized+profit);s.realized=round(s.realized+profit);s.fees=round(s.fees+f);return profit;}
 function act(state,action){const s=structuredClone(state),a=s.assets[action.asset];if(s.ended)return s;
  if(action.type==='buy'||action.type==='sell'){
   if(s.rules.halt===action.asset){s.message=`Trading Halt: ${a.name} cannot be traded this turn.`;return s;}
   const q=Number(action.qty);if(!a||!Number.isSafeInteger(q)||q<1){s.message='Choose a positive whole number of shares.';return s;}
   const gross=round(q*a.price),f=fee(gross),total=round(gross+f);
   if(action.type==='buy'){if(!Number.isFinite(total)||total>s.cash){s.message='Not enough cash for these shares and their fee.';return s;}s.cash=round(s.cash-total);a.qty+=q;a.cost=round(a.cost+total);s.fees=round(s.fees+f);record(s,`Bought ${q} ${a.name} for $${total.toFixed(2)}, including $${f.toFixed(2)} fee.`);}
   else{if(q>a.qty){s.message='You do not own that many shares.';return s;}const profit=sell(s,a,q);record(s,`Sold ${q} ${a.name}. Realised profit: $${profit.toFixed(2)} after fees.`);}s.trades++;
  }else if(action.type==='card'){
   const problem=cardReason(s,action.index,action.asset);
   if(problem){s.message=problem;return s;}
   const card=s.hand[action.index],kind=card==='echo'?s.played[0].kind:card;
   applyCard(s,kind,action.asset);
   s.hand.splice(action.index,1);s.discard.push(card);
   s.played.push({card,kind,asset:action.asset});s.cardsPlayed++;
   record(s,`${labels[card]}${card==='echo'?` → ${labels[kind]}`:''} on ${a?a.name:'the Manipulator'}. ${a?effectText(s,a):'Its moves are revealed for 2 turns.'} ${s.rules.plays-s.played.length} card plays left.`);
  }else if(action.type==='advance'){
   const unused=s.hand.map(c=>labels[c]).join(', ');
   s.discard.push(...s.hand);s.hand=[];
   s.turnHistory.push({turn:s.step+1,played:s.played.map(p=>`${labels[p.card]} on ${s.assets[p.asset]?.name??'the boss'}`),unused});
   s.played=[];
   // PROTOTYPE boss: committed intent announced last turn resolves around this tick.
   const intent=s.boss.intent,logBefore=s.boss.log.length;bossPreTick(s,intent);
   s.step++;const event=s.events[s.step];if(event){s.news.unshift({step:s.step,text:event.text,kind:event.kind});const target=s.assets[event.asset];target.value+=event.value;target.pressure=event.pressure;target.outlook=event.outlook;}
   s.assets.forEach((a,i)=>{
    const before=a.price,noise=(((s.step*17+i*11)%13)-6)*.12;
    // Boss pressure counts as market movement, so Stabilize halves it too.
    const bossDelta=a.bossEffects.reduce((n,e)=>n+e.amount,0);
    const correction=.12*(a.value-before),marketOnly=correction+a.pressure+noise+(event?.asset===i?event.shock:0),natural=marketOnly+bossDelta;
    const accelerated=natural+(a.accelerate?correction:0);
    const shaped=a.stabilize?accelerated*.5:accelerated;
    const base=a.effect?(a.effect.kind==='suppress'?-3:3):0,bonus=a.effect?.boost?3:0;
    const quote=delta=>round(Math.max(10,before+delta));
    const without=quote(natural),afterAccelerate=quote(accelerated),afterStabilize=quote(shaped),withBase=quote(shaped+base);
    a.price=quote(shaped+base+bonus);
    const parts=[{label:'Market forces',amount:round(quote(marketOnly)-before)}];
    if(a.bossEffects.length)parts.push({label:'◆ '+[...new Set(a.bossEffects.map(e=>bossLabels[e.kind]))].join(' + '),amount:round(without-quote(marketOnly))});
    // Group simultaneous shaping so its interaction is not presented as two
    // independent contributions. Never render the hidden valuation input.
    const shaping=round(afterStabilize-without);
    if(a.accelerate||a.stabilize)parts.push({label:a.accelerate&&a.stabilize?'Accelerate + Stabilize':a.accelerate?'Accelerate':'Stabilize',amount:shaping});
    if(a.effect)parts.push({label:labels[a.effect.kind],amount:round(withBase-afterStabilize)});
    if(a.effect?.boost)parts.push({label:'Informed Influence',amount:round(a.price-withBase)});
    a.movement={step:s.step,before,without,parts,actual:round(a.price-before),powered:!!(a.effect||a.accelerate||a.stabilize)};
    a.stabilize=false;a.accelerate=false;
    a.history.push(a.price);a.pressure=round(a.pressure*.65);
    if(a.effect&&--a.effect.remaining===0)a.effect=null;
    a.bossEffects=a.bossEffects.filter(e=>--e.remaining>0);
   });
   record(s,`Discarded: ${unused||'none'}. Market advanced to tick ${s.step}.${event?' New public news.':''}${s.assets.some(a=>a.revealUntil===s.step)?' A revelation expired.':''}`);
   bossPostTick(s,intent);
   const moves=s.boss.log.slice(0,s.boss.log.length-logBefore).reverse().map(l=>l.text).join(' ');if(moves)s.message+=' ◆ '+moves;
   s.rules=s.nextRules;s.nextRules={plays:2,draw:3,halt:null};
   if(s.step===steps){s.assets.forEach(a=>{if(a.qty){const q=a.qty,p=sell(s,a,q);s.log.unshift({step:s.step,text:`Closing sale: ${q} ${a.name}; realised profit $${p.toFixed(2)} after fee.`});}});
    s.assets.forEach((a,i)=>{if(s.boss.pos[i].qty)bossSell(s,i,'Closing sale');});
    s.boss.intent=null;s.ended=true;
    const mine=round(equity(s)-1000),theirs=bossProfit(s);
    s.message=`Day closed. You ${mine<0?'−':'+'}$${Math.abs(mine).toFixed(2)} vs Manipulator ${theirs<0?'−':'+'}$${Math.abs(theirs).toFixed(2)} — ${mine>theirs?'you beat the boss.':mine===theirs?'a dead heat.':'the boss wins this day.'}`;
   }else{draw(s,s.rules.draw);planBoss(s);}
  }
  if(s.targetStep===null&&equity(s)>=1100)s.targetStep=s.step;return s;
 }

 const labels={investigate:'Investigate',influence:'Influence',suppress:'Suppress',stabilize:'Stabilize',accelerate:'Accelerate',extend:'Extend',echo:'Echo',wiretap:'Wiretap'};
 const descriptionsByCard={
  investigate:'Reveal live underlying value now and through the next two results. Hides on the third tick.',
  influence:'+$3 per tick for 3 ticks. If revealed at activation: +$6 per tick, locked in. Cannot replace active pressure.',
  suppress:'−$3 per tick for 3 ticks. Underlying value stays unchanged. Cannot replace active pressure.',
  stabilize:'Halve natural market movement next tick—both rises and falls. Card pressure applies afterwards.',
  accelerate:'Double correction toward underlying value next tick. News pressure and fluctuations stay unchanged.',
  extend:'Add 1 tick to active Influence or Suppress. Each pressure effect can be extended only once.',
  echo:'Use as your second play. Repeat your first card on a different eligible company; its conditions are checked again.',
  wiretap:'Play on the boss. Reveals its committed moves, targets and trades this turn and next turn.'
 };
 function shuffle(s,cards){
  const pile=[...cards];
  for(let i=pile.length-1;i>0;i--){s.seed=(Math.imul(1664525,s.seed)+1013904223)>>>0;const j=Math.floor(s.seed/4294967296*(i+1));[pile[i],pile[j]]=[pile[j],pile[i]];}
  return pile;
 }
 function draw(s,n=3){while(s.hand.length<n){if(!s.deck.length){if(!s.discard.length)break;s.deck=shuffle(s,s.discard);s.discard=[];s.reshuffles++;}s.hand.push(s.deck.pop());}}
 function initial(scenarioSeed=1){const s=baseInitial();Object.assign(s,{scenarioSeed,events:makeEvents(scenarioSeed),seed:260926,deck:[],discard:[],hand:[],played:[],cardsPlayed:0,reshuffles:0,turnHistory:[],guided:false});s.deck=shuffle(s,Object.keys(labels).flatMap(c=>[c,c]));draw(s);
  s.rules={plays:2,draw:3,halt:null};s.nextRules={plays:2,draw:3,halt:null};
  s.wiretapUntil=0;s.boss={cash:1000,realized:0,fees:0,pos:names.map(()=>({qty:0,cost:0})),intent:null,op:null,lastAttack:null,rng:(scenarioSeed*2654435761^0x5bd1e995)>>>0,log:[]};
  planBoss(s);s.message='Beat the Manipulator’s profit by closing. Its next move is hinted at the top; Wiretap reveals the details.';return s;}

 // ---- PROTOTYPE boss: The Manipulator. Public information only; committed telegraphs. ----
 // Each turn it commits to: an operation step (pump or dump), an optional attack, and a trade.
 const bossLabels={pump:'Pump',dump:'Dump',smear:'Smear',audit:'Hostile Audit',halt:'Trading Halt'};
 const bossDescriptions={
  pump:'An operation on every company it held when the operation began: +$5 per tick for 2–4 ticks. The length is never announced.',
  dump:'Ends the pump (early if a report is due on the coming tick) the tick after it stops. It sells the pumped shares at the quote before that tick moves, which also dodges that tick’s news. Each company then takes −$6 for every tick it was pumped.',
  smear:'−$8 on the coming tick against whichever company was your largest holding (by value) when it was announced. Selling it this turn dodges the hit.',
  audit:'Next turn you draw only 2 cards and may play only 1.',
  halt:'Next turn one company cannot be bought or sold. It may lock you out of a pump, trap you before a report, or trap you after a drop.'
 };
 const bossRoll=s=>{s.boss.rng=(Math.imul(s.boss.rng,1103515245)+12345)>>>0;return s.boss.rng/4294967296;};
 const bossEquity=s=>round(s.boss.cash+s.assets.reduce((n,a,i)=>n+s.boss.pos[i].qty*a.price,0));
 const bossProfit=s=>round(bossEquity(s)-1000);
 const wiretapped=s=>s.step<s.wiretapUntil;
 function bossLog(s,text){s.boss.log.unshift({step:s.step,text});s.log.unshift({step:s.step,text:'◆ Manipulator: '+text});}
 function bossSell(s,i,why,price=s.assets[i].price){const b=s.boss,p=b.pos[i],a=s.assets[i],gross=round(p.qty*price),f=fee(gross),profit=round(gross-f-p.cost);b.cash=round(b.cash+gross-f);b.fees=round(b.fees+f);b.realized=round(b.realized+profit);bossLog(s,`${why}: sold ${p.qty} ${a.name} at $${price.toFixed(2)} (${profit<0?'−':'+'}$${Math.abs(profit).toFixed(2)}).`);p.qty=0;p.cost=0;}
 function largestHolding(s){let best=null;s.assets.forEach((a,i)=>{const v=a.qty*a.price;if(a.qty&&(best===null||v>s.assets[best].qty*s.assets[best].price))best=i;});return best;}
 // Report timing is public (outlooks name the tick), so the boss may plan around it.
 const reportWithin=(s,i,from,to)=>{for(let t=from;t<=to;t++)if(s.events[t]?.asset===i)return true;return false;};
 function pickHalt(s){
  const b=s.boss,mine=s.assets.map((a,i)=>a.qty?i:-1).filter(i=>i>=0),op=b.op;
  // Defensive: lock the player out of a pump they have not joined.
  if(op&&op.done<op.length){const out=op.assets.filter(i=>!s.assets[i].qty);if(out.length&&bossRoll(s)<.6)return out[Math.floor(bossRoll(s)*out.length)];}
  // Trap a holding before its report resolves at the end of the halted turn.
  const beforeNews=mine.filter(i=>s.events[s.step+2]?.asset===i);if(beforeNews.length)return beforeNews[0];
  // Trap a holding that just fell.
  const falling=mine.filter(i=>(s.assets[i].movement?.actual??0)<-2);if(falling.length)return falling[Math.floor(bossRoll(s)*falling.length)];
  const pool=mine.length?mine:[0,1,2];return pool[Math.floor(bossRoll(s)*pool.length)];
 }
 function planBoss(s){
  const b=s.boss,lead=round(equity(s)-1000-bossProfit(s)),held=b.pos.map((p,i)=>p.qty?i:-1).filter(i=>i>=0),turnsLeft=steps-s.step;
  let op=null,attack=null,trade=null;
  // It usually, not always, steps aside before a report; gambling keeps it less predictable.
  const dodge=bossRoll(s)<.6,newsNext=i=>dodge&&s.events[s.step+1]?.asset===i;
  // It dumps early rather than hold a pumped company through its report.
  // A sprung trap (halt announced last turn on a pump the player joined) dumps now.
  if(b.op&&b.trap){op={kind:'dump',assets:b.op.assets};b.trap=false;}
  else if(b.op){op=b.op.done>=b.op.length||turnsLeft<=1||b.op.assets.some(newsNext)?{kind:'dump',assets:b.op.assets}:{kind:'pump',assets:b.op.assets};}
  else{const calm=held.filter(i=>!newsNext(i));if(calm.length&&turnsLeft>=3)op={kind:'pump',assets:calm,start:true};}
  const attackedLast=b.lastAttack===s.step;
  // Bait combo: the player joined a running pump, so halt it, pump once more, then dump into the lock.
  const joined=op?.kind==='pump'&&!op.start?op.assets.filter(i=>s.assets[i].qty).sort((x,y)=>s.assets[y].qty*s.assets[y].price-s.assets[x].qty*s.assets[x].price):[];
  if(!attackedLast&&joined.length&&turnsLeft>=2&&bossRoll(s)<.4){attack={kind:'halt',asset:joined[0]};b.trap=true;}
  else if(!attackedLast&&turnsLeft>=1){
   const big=largestHolding(s),options=[];
   if(lead>=15){
    if(big!==null&&s.assets[big].qty*s.assets[big].price>=100)options.push({kind:'smear',asset:big});
    if(turnsLeft>=2)options.push({kind:'halt'},{kind:'audit'});
   }else if(b.op&&turnsLeft>=2&&b.op.assets.some(i=>!s.assets[i].qty)&&bossRoll(s)<.35)options.push({kind:'halt'});
   if(options.length){attack=options[Math.floor(bossRoll(s)*options.length)];if(attack.kind==='halt')attack.asset=pickHalt(s);}
  }
  const inOp=i=>(b.op||op)?.assets.includes(i);
  const risky=held.find(i=>!inOp(i)&&(newsNext(i)||s.assets[i].price<b.pos[i].cost/b.pos[i].qty*.88));
  if(risky!==undefined)trade={type:'sell',asset:risky};
  else if(held.length<2&&b.cash>150&&turnsLeft>=4){
   const pick=s.assets.map((a,i)=>({i,score:(reportWithin(s,i,s.step+2,s.step+3)?-20:0)+(a.movement?.actual??0)*.3+bossRoll(s)*12})).filter(o=>!b.pos[o.i].qty).sort((x,y)=>y.score-x.score)[0];
   if(pick)trade={type:'buy',asset:pick.i};
  }
  b.intent={op,attack,trade,announcedAt:s.step};
 }
 function bossPreTick(s,intent){
  const b=s.boss;if(!intent)return;const{op,attack,trade}=intent;
  if(trade?.type==='sell'&&b.pos[trade.asset].qty)bossSell(s,trade.asset,'Exit');
  if(op?.start){b.op={assets:op.assets,done:0,length:Math.min(2+Math.floor(bossRoll(s)*3),steps-s.step-1)};bossLog(s,`Pump begins on ${op.assets.map(i=>s.assets[i].name).join(' and ')}.`);}
  if(op?.kind==='pump'){b.op.assets.forEach(i=>s.assets[i].bossEffects.push({kind:'pump',amount:5,remaining:1}));b.op.done++;}
  if(op?.kind==='dump'){b.op.assets.forEach(i=>{if(b.pos[i].qty)bossSell(s,i,'Dump sale');s.assets[i].bossEffects.push({kind:'dump',amount:-6*b.op.done,remaining:1});});bossLog(s,`Dump on ${b.op.assets.map(i=>s.assets[i].name).join(' and ')} after ${b.op.done} pumped ticks.`);b.op=null;}
  if(attack){b.lastAttack=s.step+1;
   if(attack.kind==='smear'){s.assets[attack.asset].bossEffects.push({kind:'smear',amount:-8,remaining:1});bossLog(s,`Smear on ${s.assets[attack.asset].name}.`);}
   if(attack.kind==='audit'){s.nextRules.plays=1;s.nextRules.draw=2;bossLog(s,'Hostile Audit: next turn you draw 2 and play 1.');}
   if(attack.kind==='halt'){s.nextRules.halt=attack.asset;bossLog(s,`Trading Halt on ${s.assets[attack.asset].name} next turn.`);}
  }
 }
 function bossPostTick(s,intent){
  const b=s.boss,t=intent?.trade;if(!t)return;const a=s.assets[t.asset],p=b.pos[t.asset];
  if(t.type==='buy'){const q=Math.floor(Math.min(b.cash,bossEquity(s)*.5)/(a.price*1.005));if(q>0){const gross=round(q*a.price),f=fee(gross);b.cash=round(b.cash-gross-f);b.fees=round(b.fees+f);p.qty+=q;p.cost=round(p.cost+gross+f);bossLog(s,`Bought ${q} ${a.name} at $${a.price.toFixed(2)}.`);}}
 }
 function targetReason(s,kind,index){
  if(kind==='wiretap')return index!=='boss'?'Wiretap targets the boss: play it from the boss strip.':wiretapped(s)?'Wiretap already active.':'';
  if(index==='boss')return 'Only Wiretap targets the boss.';
  const a=s.assets[index];if(!a)return 'Choose a company.';
  if(kind==='investigate'&&revealed(s,a))return 'Already revealed; choose another company.';
  if((kind==='influence'||kind==='suppress')&&a.effect)return 'Pressure already active; choose another company.';
  if(kind==='stabilize'&&a.stabilize)return 'Already stabilized for the next tick.';
  if(kind==='accelerate'&&a.accelerate)return 'Already accelerated for the next tick.';
  if(kind==='extend'&&!a.effect)return 'Needs active Influence or Suppress.';
  if(kind==='extend'&&a.effect.extended)return 'This pressure effect has already been extended.';
  return '';
 }
 function cardReason(s,index,asset){
  if(s.ended)return 'Session complete.';
  if(s.played.length>=s.rules.plays)return s.rules.plays===1?'Hostile Audit: one play this turn. End the turn for a fresh hand.':'Two cards played. End the turn for a fresh hand.';
  const card=s.hand[index];if(!card)return 'Choose a card in your hand.';
  if(card==='echo'){
   if(s.played.length!==1)return 'Play another card first.';
   if(s.played[0].kind==='wiretap')return 'Nothing to echo: Wiretap cannot repeat.';
   if(s.played[0].asset===asset)return 'Echo needs a different company.';
   return targetReason(s,s.played[0].kind,asset);
  }
  return targetReason(s,card,asset);
 }
 function applyCard(s,kind,index){if(kind==='wiretap'){s.wiretapUntil=s.step+2;return;}const a=s.assets[index];
  if(kind==='investigate')a.revealUntil=s.step+3;
  if(kind==='influence'||kind==='suppress'){const boost=kind==='influence'&&revealed(s,a);a.effect={kind,remaining:3,amount:kind==='suppress'?-3:boost?6:3,boost,extended:false};if(boost)s.boosts++;}
  if(kind==='stabilize')a.stabilize=true;
  if(kind==='accelerate')a.accelerate=true;
  if(kind==='extend'){a.effect.remaining++;a.effect.extended=true;}
 }
 function effectText(s,a){return [revealed(s,a)?`Revealed until tick ${a.revealUntil}.`:'',a.effect?`${labels[a.effect.kind]}: ${a.effect.amount>0?'+':''}$${a.effect.amount} for ${a.effect.remaining} ticks${a.effect.boost?' (Informed Influence)':''}${a.effect.extended?', extended':''}.`:'',a.stabilize?'Stabilize next tick.':'',a.accelerate?'Accelerate next tick.':''].filter(Boolean).join(' ')||'No active effects.';}
 return {steps,initial,act,fee,round,revealed,equity,labels,descriptionsByCard,cardReason,effectText,bossLabels,bossDescriptions,bossEquity,bossProfit,wiretapped};
})();

</script><script>// Three fixed-screen compositions; one unchanged market engine and card-first flow.
const $=id=>document.getElementById(id),money=n=>'$'+n.toFixed(2),signed=n=>(n<0?'−':'+')+money(Math.abs(n));
const scenes=['A','B','C'],names={A:'Exact telegraph',B:'Partial telegraph',C:'Hazy telegraph'},tickers=['FRG','HBR','LMN'],icons=['◇','≋','ϟ'];
const cardIcons={investigate:'◎',influence:'↗',suppress:'↘',stabilize:'⏸',accelerate:'»',extend:'✚',echo:'◈',wiretap:'◉'};
let state=Engine.initial(),selection=0,armed=null,variant=scenes.includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'B',drawerKind=null,returnFocus=null;
const quantities=['1','1','1'];
const pct=a=>Math.round(a.qty*a.price/Engine.equity(state)*100),pl=a=>Engine.round(a.qty*a.price-a.cost);
function delta(a){return a.movement?`<span class="${a.movement.actual<0?'down':'up'}">${a.movement.actual<0?'↓':a.movement.actual>0?'↑':'→'} ${signed(a.movement.actual)}</span>`:'<span class="muted">No prior tick</span>';}
function effects(a){const parts=[];if(a.effect)parts.push(`${Engine.labels[a.effect.kind]} ${signed(a.effect.amount)} · ${a.effect.remaining}t`);if(a.stabilize)parts.push('Stabilize · 1t');if(a.accelerate)parts.push('Accelerate · 1t');if(Engine.revealed(state,a))parts.push(`◎ Value ${money(a.value)} · ${a.revealUntil-state.step}t`);const i=state.assets.indexOf(a),bp=state.boss.pos[i],boss=[];if(state.rules.halt===i&&!state.ended)boss.push(['halt-chip','⛔ Trading halted this turn']);if(bp.qty)boss.push(['boss-chip',`◆ Boss holds ${bp.qty}`]);if(state.boss.op?.done&&state.boss.op.assets.includes(i))boss.push(['boss-chip',`◆ Pumped ${state.boss.op.done}t`]);a.bossEffects.forEach(e=>boss.push(['boss-chip',`◆ ${Engine.bossLabels[e.kind]} ${signed(e.amount)} · ${e.remaining}t`]));return parts.map(p=>`<span>${p}</span>`).join('')+boss.map(([c,p])=>`<span class="${c}">${p}</span>`).join('');}

// PROTOTYPE boss presentation. Two information levels: restricted by default, full while wiretapped.
const tick=i=>tickers[i];
function score(){const mine=Engine.round(Engine.equity(state)-1000),theirs=Engine.bossProfit(state),lead=Engine.round(mine-theirs);return `<div class="score"><small>Your profit</small><b class="${mine<0?'down':'up'}">${signed(mine)}</b></div><div class="score"><small>◆ Boss profit</small><b class="${theirs<0?'down':'up'}">${signed(theirs)}</b></div><div class="score"><small>Your lead</small><b class="${lead>=0?'lead':'trail'}">${signed(lead)}</b></div>`;}
function intentText(it){const open=Engine.wiretapped(state),bits=[];let trade='hidden';
 if(it?.op){const k=it.op.kind,loss=-6*(state.boss.op?.done??0);bits.push(open?`${Engine.bossLabels[k]} ${it.op.assets.map(tick).join(' + ')}${k==='dump'?' '+signed(loss):''}`:'Market move');}
 if(it?.attack){const a=it.attack;if(a.kind==='smear')bits.push(open?`Smear ${tick(a.asset)}`:'Market move');else if(a.kind==='halt')bits.push(open?`Trading Halt ${tick(a.asset)}`:'Trading Halt');else bits.push('Hostile Audit');}
 if(open)trade=it?.trade?`${it.trade.type==='buy'?'buys':'sells'} ${tick(it.trade.asset)}`:'none';
 return {bits:[...new Set(bits)],trade,open};}
function bossStrip(){const b=state.boss,it=intentText(b.intent),holds=b.pos.map((p,i)=>p.qty?`<b>${tick(i)} ${p.qty}</b>`:'').filter(Boolean).join(' · ')||'nothing',wiretapArmed=armed!==null&&state.hand[armed]==='wiretap';
 const moves=it.bits.length?it.bits.map(x=>`<span class="threat">⚠ ${x}</span>`).join(''):'<span class="threat quiet">Quiet</span>';
 return `<section class="boss-strip" aria-label="Boss"><span class="boss-name"><small>BOSS</small>◆ The Manipulator</span><span class="boss-holds">Holds ${holds} · cash ${money(b.cash)}</span><span class="boss-intent">${state.ended?'<small>Day closed.</small>':`<small>On your End Turn:</small>${moves}<small>Trade ${it.trade}</small>${it.open?`<span class="wiretap-on">◉ Wiretapped · ${state.wiretapUntil-state.step}t</span>`:''}`}</span>${wiretapArmed?`<button id="wiretap-boss" class="primary" ${Engine.cardReason(state,armed,'boss')?'disabled':''}>◉ Play Wiretap here</button>`:''}<button id="boss-info" data-menu="boss">Boss ↗</button></section>`;}
function bossDrawer(){const b=state.boss;return `<p>The Manipulator trades the same three companies with its own $1,000, the same 0.5% fees, and only public information. It settles at closing like you. <b>Win the day by finishing with a higher profit.</b></p><p>Each turn it commits to its operation step (pump or dump), possibly an attack, and one trade. These resolve when you press End Turn: sales and powers before the market moves, purchases at the new quotes afterwards. It usually steps aside before a company’s report and gambles on some. When you lead by $15 or more it attacks, though never on two turns in a row. It may also halt a pump you haven’t joined. Its price effects count as market movement, so Stabilize halves them.</p><p>By default you see only what kind of move is coming: pumps, dumps and smears all read as “Market move”, and Trading Halt hides its target. Trades are hidden. <b>Wiretap</b> reveals every target and trade for 2 turns. If you join its pump, it may halt that company and dump into the lock. ${Engine.wiretapped(state)?'Wiretap is active now.':''}</p><h3>Powers</h3>${Object.entries(Engine.bossDescriptions).map(([k,d])=>`<p><b>◆ ${Engine.bossLabels[k]}:</b> ${d}</p>`).join('')}<h3>Position</h3><p>Cash ${money(b.cash)} · realized ${signed(b.realized)} · fees ${money(b.fees)} · profit ${signed(Engine.bossProfit(state))}</p>${b.pos.map((p,i)=>p.qty?`<p>${state.assets[i].name}: ${p.qty} shares · avg ${money(p.cost/p.qty)}</p>`:'').join('')}<h3>What it has done</h3>${b.log.map(n=>`<article><small>Tick ${n.step}</small><p>${n.text}</p></article>`).join('')||'<p>Nothing yet.</p>'}`;}
function nextReport(a){const ts=[...a.outlook.matchAll(/tick (\d+)/gi)].map(m=>Number(m[1])).filter(t=>t>state.step);if(/next tick/i.test(a.outlook))ts.push(state.step+1);return ts.length?'Report T'+Math.min(...ts)+' · '+(Math.min(...ts)-state.step)+'t away':state.ended?'Market closed':'No announced report';}
// Shared green board and bottom hand; only company-card presentation varies.
function accounting(a){return `<section class="holdings"><div><small>Average entry · incl. fees</small><b>${a.qty?money(a.cost/a.qty):'—'}</b></div><div><small>Unrealized P/L*</small><b class="${pl(a)<0?'down':'up'}">${signed(pl(a))}</b></div></section>`;}
function price(a){return `<div class="quote"><strong>${money(a.price)}</strong><div><small>Previous ${a.movement?money(a.movement.before):'—'}</small><b>${delta(a)}</b></div></div>`;}
function historyChart(a,annotated=false){const m=a.movement,values=[...a.history,m?.without??a.price],lo=Math.min(...values)-3,hi=Math.max(...values)+3,x=i=>38+i*218/12,y=p=>91-(p-lo)/(hi-lo)*72;return `<div class="chart ${annotated?'annotated':''}"><svg viewBox="0 0 340 116" role="img" aria-label="${a.name} price history. Actual ${money(a.price)}${m?'; without this tick’s cards '+money(m.without):'; opening quote, no prior tick'}"><text x="0" y="17">${money(hi-3)}</text><text x="0" y="96">${money(lo+3)}</text><line x1="38" x2="258" y1="97" y2="97" stroke="currentColor" opacity=".2"/><polyline points="${a.history.map((p,i)=>`${x(i)},${y(p)}`).join(' ')}" fill="none" stroke="currentColor" stroke-width="2.5"/>${m?`<line x1="${x(state.step)}" x2="${x(state.step)}" y1="${y(a.price)}" y2="${y(m.without)}" stroke="#dfba76" stroke-width="2" stroke-dasharray="3 2"/><circle cx="${x(state.step)}" cy="${y(m.without)}" r="4.5" fill="var(--panel)" stroke="#dfba76" stroke-width="2"/>`:''}<circle cx="${x(state.step)}" cy="${y(a.price)}" r="3" fill="var(--accent)"/>${annotated&&m?`<line x1="${x(state.step)+7}" x2="266" y1="${y(a.price)}" y2="23" stroke="var(--accent)" opacity=".5"/><text x="271" y="18" class="chart-label">● Actual</text><text x="271" y="33" class="chart-price">${money(a.price)}</text><line x1="${x(state.step)+7}" x2="266" y1="${y(m.without)}" y2="68" stroke="#dfba76" opacity=".5" stroke-dasharray="3 2"/><text x="271" y="63" class="chart-label">○ No cards</text><text x="271" y="78" class="chart-price ghost">${money(m.without)}</text>`:annotated?`<text x="271" y="18" class="chart-label">● Actual</text><text x="271" y="33" class="chart-price">${money(a.price)}</text><text x="271" y="63" class="chart-label">○ No cards</text><text x="271" y="78" class="chart-price ghost">—</text>`:''}<text x="38" y="112">Opening</text><text x="216" y="112">Tick 12</text></svg></div>`;}
function exposure(a,mode='bar'){const share=Math.min(100,Math.max(0,a.qty*a.price/Engine.equity(state)*100)),meter=`role="meter" aria-label="${a.name} exposure as a percentage of wealth" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${share.toFixed(2)}"`;return `<section class="position-block ${mode==='dial'?'position-dial':'position-bar'} ${a.qty?'invested':'empty'}">${mode==='dial'?`<div class="exposure-dial" style="--exposure:${share}%" ${meter}><div><strong>${pct(a)}%</strong></div></div>`:''}<div class="position-content"><div class="position-summary"><strong>${a.qty} shares held</strong><b>${money(a.qty*a.price)}</b>${mode==='bar'?`<b class="exposure-percent">${pct(a)}%</b>`:''}</div>${mode==='bar'?`<div class="exposure-track" ${meter}><span style="width:${share}%;${a.qty?'min-width:3px':''}"></span></div>`:''}${accounting(a)}</div></section>`;}
function exactParts(a){const m=a.movement,max=m?Math.max(1,...m.parts.map(p=>Math.abs(p.amount))):1,change=m?Engine.round(a.price-m.without):0;return `<section class="contributions visual-parts"><div class="section-label"><span>Price contributions</span><span>${m?'Tick '+m.step:'Opening'}</span></div><div class="parts">${m?m.parts.map(p=>`<div class="part ${p.amount<0?'negative':'positive'}"><span>${p.label}</span><i class="part-track"><i style="width:${Math.abs(p.amount)/max*100}%"></i></i><b class="${p.amount<0?'down':'up'}">${signed(p.amount)}</b></div>`).join(''):'<p class="muted">No prior tick</p>'}</div><div class="card-total"><span class="impact-symbol">${change<0?'↘':change>0?'↗':'◇'}</span><strong class="${change<0?'down':'up'}">${m?signed(change):'—'}</strong><span>from cards</span></div></section>`;}
function company(a,i){const last=state.news.find(n=>n.step>0&&n.text.startsWith(['Forge','Harbor','Lumen'][i])),headline=last?last.text.split('. ')[0]+'.':a.outlook.split('. ')[0]+'.',reason=armed===null?'Choose a card from your hand first.':Engine.cardReason(state,armed,i),active=armed!==null&&!reason;
 return `<article class="company variant-C ${active?'eligible':''} ${a.qty?'has-position':''} ${selection===i?'mobile-active':''}" aria-label="${a.name}"><header class="company-head"><span class="crest">${icons[i]}</span><div><small>${tickers[i]} / ${['INDUSTRY','TRANSPORT','ENERGY'][i]}</small><h2>${a.name}</h2></div><button class="icon-button" id="dossier-${i}" data-menu="asset-${i}" aria-label="${a.name} dossier">ⓘ</button></header>${price(a)}${historyChart(a,true)}<div class="power-strip" aria-label="Active powers">${effects(a)}</div>${exactParts(a)}<div class="company-actions"><button class="brief" data-menu="asset-${i}" id="brief-${i}"><strong>${nextReport(a)} <span>Brief ↗</span></strong><span>${headline}</span></button>${exposure(a,'dial')}<section class="local-trade"><div class="trade-line"><label for="qty-${i}">Shares</label><input id="qty-${i}" type="number" min="1" step="1" value="${quantities[i]}" aria-label="${a.name} share quantity"><button id="buy-${i}" aria-label="Buy ${a.name}">Buy</button><button id="sell-${i}" aria-label="Sell ${a.name}">Sell</button><button class="sell-all" id="sell-all-${i}" aria-label="Sell all ${a.name} shares" ${a.qty&&!state.ended?'':'disabled'}>Sell all</button></div><p id="preview-${i}" class="preview"></p></section><button class="cast" id="cast-${i}" title="${reason||'Play on '+a.name}" ${reason?'disabled':''}>${armed===null?'◇ Choose a card first':`${cardIcons[state.hand[armed]]} Play ${Engine.labels[state.hand[armed]]} here`}</button>${armed!==null&&reason?`<small class="target-reason">${reason}</small>`:''}</div></article>`;
}

function hand(){return `<section class="hand-zone"><div class="hand-heading"><div><h2 class="hand-state">${armed===null?'Your hand':Engine.labels[state.hand[armed]]+' selected'}</h2><div class="hand-plays">${state.ended?0:state.rules.plays-state.played.length}/${state.rules.plays} plays left${state.rules.plays<2&&!state.ended?' · ◆ Hostile Audit':''}</div></div></div><div class="hand">${state.hand.map((c,i)=>`<div class="card ${armed===i?'armed':''}"><button class="pick-card" id="card-${i}" aria-pressed="${armed===i}" ${state.ended||state.played.length>=state.rules.plays?'disabled':''}><span class="card-icon" aria-hidden="true">${cardIcons[c]}</span><div><strong>${Engine.labels[c]}</strong><span>${Engine.descriptionsByCard[c]}</span></div></button><button class="card-info" id="card-info-${i}" data-menu="card-${i}" aria-label="${Engine.labels[c]} full description">ⓘ</button></div>`).join('')||'<p class="muted">No cards remain. Finish your trades, then end turn.</p>'}</div><aside class="end-zone"><div class="turn-dots" aria-label="${state.step} of 12 ticks resolved">${Array.from({length:12},(_,i)=>`<i class="${i<state.step?'done':''}"></i>`).join('')}</div><small>${state.ended?'All positions settled':`Discard ${state.hand.length} · resolve tick ${state.step+1}`}</small><button id="advance" class="primary" ${state.ended?'disabled':''}>${state.ended?'Closed':state.step===11?'End turn & settle →':'End turn →'}</button></aside></section>`;}
function render(){const focused=document.activeElement?.id;document.body.className='scene-'+variant;$('app').innerHTML=`<header class="hud"><div class="brand"><span class="brand-icon">◈</span><div><small>PROTOTYPE · BOSS DAY</small><h1>The trading floor</h1></div></div><div class="resources"><div><small>Cash</small><b>${money(state.cash)}</b></div><div><small>Wealth</small><b>${money(Engine.equity(state))}</b></div>${score()}</div><button id="session" data-menu="session">☷ Menu</button></header><div class="status-line"><span class="status" role="status" aria-live="polite">${state.message}</span><div class="archive-buttons"><button id="activity" data-menu="activity">Activity ↗</button><button id="news" data-menu="news">News archive ↗</button></div></div>${bossStrip()}<div class="mobile-quotes">${state.assets.map((a,i)=>`<button id="mobile-${i}" aria-pressed="${selection===i}"><b>${tickers[i]} ${money(a.price)}</b><small>Prev ${a.movement?money(a.movement.before):'—'} · ${a.movement?signed(a.movement.actual):'opening'}</small></button>`).join('')}</div><main class="workspace"><section class="companies">${state.assets.map(company).join('')}</section>${hand()}</main><footer><span>*Open P/L excludes selling fees · 0.5% per trade</span></footer>`;
 document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.menu,b.id));
 state.assets.forEach((a,i)=>{$('qty-'+i).oninput=e=>{quantities[i]=e.target.value;preview();};$('buy-'+i).onclick=()=>dispatch({type:'buy',asset:i,qty:quantities[i]});$('sell-'+i).onclick=()=>dispatch({type:'sell',asset:i,qty:quantities[i]});$('sell-all-'+i).onclick=()=>dispatch({type:'sell',asset:i,qty:state.assets[i].qty});$('cast-'+i).onclick=()=>{if(armed!==null){selection=i;dispatch({type:'card',asset:i,index:armed});}};$('mobile-'+i).onclick=()=>{selection=i;render();};});
 state.hand.forEach((c,i)=>$('card-'+i).onclick=()=>{armed=armed===i?null:i;render();});$('advance').onclick=()=>dispatch({type:'advance'});if($('wiretap-boss'))$('wiretap-boss').onclick=()=>dispatch({type:'card',asset:'boss',index:armed});preview();if(focused)$(focused)?.focus({preventScroll:true});}
function preview(){state.assets.forEach((a,i)=>{const q=Number(quantities[i]),valid=Number.isSafeInteger(q)&&q>0,gross=Engine.round(q*a.price),fee=Engine.fee(gross);$('preview-'+i).textContent=valid?`Buy ${money(Engine.round(gross+fee))} · sell ${money(Engine.round(gross-fee))} · fee ${money(fee)}`:'Enter positive whole shares.';const halted=state.rules.halt===i;$('buy-'+i).disabled=halted||state.ended||!valid||gross+fee>state.cash;$('sell-'+i).disabled=halted||state.ended||!valid||q>a.qty;$('sell-all-'+i).disabled=halted||state.ended||!a.qty;if(halted)$('preview-'+i).textContent='◆ Trading Halt: no trades in this company this turn.';});}
function dispatch(action){state=Engine.act(state,action);if(action.type==='card'||action.type==='advance')armed=null;render();}
function switchScene(dir){variant=scenes[(scenes.indexOf(variant)+dir+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);try{history.replaceState(null,'',url);}catch{}render();}
function openDrawer(kind,from){drawerKind=kind;returnFocus=from;fillDrawer();$('drawer').showModal();$('close-drawer').focus();}
function closeDrawer(){$('drawer').close();drawerKind=null;if(returnFocus)$(returnFocus)?.focus({preventScroll:true});}
function fillDrawer(){let title='',body='';if(drawerKind.startsWith('asset-')){const i=Number(drawerKind.split('-')[1]),a=state.assets[i],past=state.news.filter(n=>n.step>0&&n.text.startsWith(['Forge','Harbor','Lumen'][i]));title=a.name+' / dossier';body=`<h3>Known / public evidence</h3><p>${past[0]?.text||a.description+' No company report has resolved yet.'}</p><h3>Unresolved / upcoming reports</h3><p>${a.outlook}</p><h3>Active powers</h3><p>${Engine.effectText(state,a)}</p>${Engine.revealed(state,a)?`<p>Current investigated value ${money(a.value)}. ${a.revealUntil-state.step} ticks remaining. This does not reveal future outcomes.</p>`:'<p>Current value hidden. Investigate to reveal.</p>'}<h3>How to read the chart</h3><p>The hollow marker and “without this tick’s cards” quote exclude the current tick’s price cards, starting from the same previous quote. Earlier card effects are still part of that starting quote. This is not a whole-run counterfactual.</p><p>Contributions include rounding and the $10 floor. The graph and price gauge use a local scale per company. Contribution bars scale to the largest displayed component in that company. Signed numbers show exact magnitudes; shapes and colors do not predict future returns. Exposure meters always run from 0% to 100% of current wealth.</p><h3>Company report history</h3>${past.map(n=>`<article><small>Tick ${n.step} · ${n.kind}</small><p>${n.text}</p></article>`).join('')||'<p>No resolved reports.</p>'}`;}else if(drawerKind.startsWith('card-')){const c=state.hand[Number(drawerKind.split('-')[1])];title=cardIcons[c]+' '+Engine.labels[c];body=`<p>${Engine.descriptionsByCard[c]}</p><p>Select the card, then click a company’s play button. Selection alone does not spend a play.</p>${c==='echo'&&state.played.length===1?`<p>Copies ${Engine.labels[state.played[0].kind]}. Choose a different company than ${state.assets[state.played[0].asset].name}.</p>`:''}`;}else if(drawerKind==='boss'){title='◆ The Manipulator';body=bossDrawer();}else if(drawerKind==='news'){title='Public news archive';body=state.news.map(n=>`<article><small>Tick ${n.step} · ${n.kind}</small><p>${n.text}</p></article>`).join('');}else if(drawerKind==='activity'){title='Activity & accounting';body=`<p>Realized P/L ${signed(state.realized)} · fees ${money(state.fees)} · seed ${state.scenarioSeed}${state.debug?' · debug-assisted':''}.</p><h3>Played this turn</h3><p>${state.played.map(p=>Engine.labels[p.card]+' on '+state.assets[p.asset].name).join('; ')||'None'}</p>${state.log.map(n=>`<article><small>After tick ${n.step}</small><p>${n.text}</p></article>`).join('')}<h3>Past hands</h3>${state.turnHistory.map(t=>`<p>Turn ${t.turn} · played ${t.played.join('; ')||'none'} · discarded ${t.unused||'none'}</p>`).join('')}`;}else{title='Session & reference';body=`<p>PROTOTYPE: one boss day against The Manipulator, on the accepted C board. Restricted boss information by default; the Wiretap card reveals details. Reloading starts a new run.</p><div class="session-controls"><label for="seed">Scenario seed</label><input id="seed" type="number" min="1" max="999999" value="${state.scenarioSeed}"><button id="load-seed">Load seed</button><button id="replay">Replay current seed</button><button id="new-seed">New scenario</button></div><h3>Rules</h3><p>12 turns. $1,000 capital. Beat the Manipulator’s closing profit (see Boss ↗). Trade freely at current quotes with 0.5% fees. Draw three cards, play up to two, discard all unused cards at end turn. At tick 12, remaining shares settle automatically with selling fees.</p><p>Reports and price reactions arrive together. Draw order and future outcomes stay hidden. No borrowing or shorting. Progress is in memory only.</p><h3>Cards</h3>${Object.entries(Engine.descriptionsByCard).map(([c,d])=>`<p><b>${cardIcons[c]} ${Engine.labels[c]}:</b> ${d}</p>`).join('')}<p>Draw ${state.deck.length} · discard ${state.discard.length} · reshuffles ${state.reshuffles}.</p><details><summary>Public comparison state</summary><pre>${JSON.stringify({tick:state.step,seed:state.scenarioSeed,cash:state.cash,hand:state.hand,played:state.played,armedCard:armed===null?null:state.hand[armed],assets:state.assets.map(a=>({name:a.name,quote:a.price,previous:a.movement?.before??null,qty:a.qty,cost:a.cost,outlook:a.outlook,powers:Engine.effectText(state,a),...(Engine.revealed(state,a)?{value:a.value}:{})}))},null,2)}</pre></details><details id="debug"><summary>Debug inspection · spoilers</summary><p>Opening marks this session debug-assisted.</p><pre id="debug-state"></pre></details>`;}$('drawer-title').textContent=title;$('drawer-content').innerHTML=body;if(drawerKind==='session'){$('load-seed').onclick=()=>reset(Number($('seed').value));$('replay').onclick=()=>reset(state.scenarioSeed);$('new-seed').onclick=()=>reset(state.scenarioSeed%999999+1);$('debug').ontoggle=()=>{if($('debug').open){state.debug=true;$('debug-state').textContent=JSON.stringify(state,null,2);}else $('debug-state').textContent='';};}}
function reset(seed){if(!Number.isSafeInteger(seed)||seed<1||seed>999999){$('seed').setCustomValidity('Use a whole seed from 1 to 999999.');$('seed').reportValidity();return;}if((state.step||state.log.length)&&!state.ended&&!confirm('Reset this run? In-memory progress will be lost.'))return;state=Engine.initial(seed);armed=null;selection=0;quantities.fill('1');closeDrawer();render();}
$('close-drawer').onclick=closeDrawer;$('drawer').addEventListener('cancel',e=>{e.preventDefault();closeDrawer();});$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))closeDrawer();});
document.addEventListener('keydown',e=>{if($('drawer').open||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='Escape'&&armed!==null){armed=null;render();}});render();
</script></body></html>
